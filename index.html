<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base Catalog Auto</title>
    <script src="database.js"></script> 
    <style>
        :root { --bg-body: #f8fafc; --bg-sidebar: #ffffff; --text-main: #0f172a; --text-muted: #64748b; --border: #e2e8f0; --primary: #2563eb; --success: #16a34a; --success-bg: #dcfce7; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-body); color: var(--text-main); margin: 0; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 400px; background: var(--bg-sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; z-index: 20; box-shadow: 4px 0 24px rgba(0,0,0,0.05); }
        .sidebar-content { padding: 20px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 15px; }
        .total-box { background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%); color: white; padding: 20px; border-radius: 12px; text-align: center; }
        .total-val { font-size: 2.5rem; font-weight: 800; line-height: 1; }
        .total-lbl { font-size: 0.75rem; text-transform: uppercase; opacity: 0.8; letter-spacing: 1px; margin-bottom: 5px; }
        .bonus-box { background: #f1f5f9; border: 2px dashed #cbd5e1; border-radius: 10px; padding: 15px; transition: 0.3s; }
        .bonus-box.active { background: var(--success-bg); border: 2px solid #86efac; }
        .bonus-head { font-weight: 700; font-size: 0.9rem; margin-bottom: 5px; color: var(--text-muted); }
        .bonus-box.active .bonus-head { color: #15803d; }
        .bonus-text { font-size: 0.85rem; color: var(--text-muted); }
        .bonus-box.active .bonus-text { color: #166534; }
        .progress-bar { height: 6px; background: #e2e8f0; border-radius: 3px; margin-top: 8px; overflow: hidden; }
        .progress-fill { height: 100%; background: #94a3b8; width: 0%; transition: 0.3s; }
        .bonus-box.active .progress-fill { background: #22c55e; }
        .tier-list { display: flex; flex-direction: column; gap: 5px; border-top: 1px solid var(--border); padding-top: 15px; }
        .tier-item { display: flex; justify-content: space-between; padding: 6px 10px; font-size: 0.8rem; border-radius: 6px; color: var(--text-muted); }
        .tier-item.current { background: #eff6ff; color: var(--primary); font-weight: 700; border: 1px solid #bfdbfe; }
        .tier-item.passed { text-decoration: line-through; opacity: 0.5; }
        .actions { margin-top: auto; padding-top: 10px; }
        .dl-hint { text-align: center; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 8px; }
        .btn { width: 100%; padding: 12px; background: #0f172a; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
        .btn-reset { background: white; color: #ef4444; border: 1px solid #fecaca; margin-top: 5px; }
        .main { flex: 1; display: flex; flex-direction: column; background: white; }
        .toolbar { padding: 15px 25px; border-bottom: 1px solid var(--border); }
        .search-input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; background: #f8fafc; font-size: 1rem; }
        .tree-header { display: flex; padding: 10px 25px; background: #f8fafc; border-bottom: 1px solid var(--border); font-size: 0.75rem; font-weight: 700; text-transform: uppercase; color: var(--text-muted); }
        .th-name { flex: 1; padding-left: 40px; }
        .th-col { width: 90px; text-align: center; }
        .tree-wrapper { flex: 1; overflow-y: auto; padding: 0 25px 20px 25px; }
        ul { list-style: none; padding: 0; margin: 0; }
        .node-row { display: flex; align-items: center; padding: 6px 0; border-bottom: 1px solid #f1f5f9; cursor: pointer; }
        .node-row:hover { background: #f8fafc; }
        .node-row.selected { background: #eff6ff; }
        .node-row.indeterminate { background: #fff7ed; }
        .node-row.indeterminate input { opacity: 0.5; }
        .row-left { flex: 1; display: flex; align-items: center; padding-right: 10px; overflow: hidden; }
        .row-right { display: flex; gap: 5px; }
        .toggler { width: 24px; display: flex; justify-content: center; margin-right: 5px; color: #94a3b8; cursor: pointer; }
        input[type="checkbox"] { margin-right: 10px; cursor: pointer; }
        .node-name { font-size: 0.9rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .badge { width: 90px; text-align: center; font-size: 0.85rem; font-weight: 700; }
        .b-lines { color: #475569; } .b-phones { color: #2563eb; } .b-emails { color: #16a34a; }
        .loader { position: fixed; inset: 0; background: white; z-index: 999; display: flex; justify-content: center; align-items: center; flex-direction: column; }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="sidebar-content">
        <div class="total-box">
            <div class="total-lbl">Итоговая стоимость</div>
            <div class="total-val"><span id="totalPrice">0</span>₽</div>
            <div style="font-size:0.8rem; opacity:0.8; margin-top:5px">Шаг 500₽</div>
        </div>
        <div class="bonus-box" id="bonusBox">
            <div class="bonus-head" id="bonusTitle">Выберите базы</div>
            <div class="bonus-text" id="bonusText">Начните выбирать регионы для расчета.</div>
            <div class="progress-bar"><div class="progress-fill" id="bucketFill"></div></div>
        </div>
        <div class="tier-list" id="tierList"></div>
        <div class="actions">
            <div class="dl-hint">Скачайте файл и отправьте менеджеру 👇</div>
            <button class="btn" onclick="downloadOrder()">⬇ Скачать заказ</button>
            <button class="btn btn-reset" onclick="resetAll()">Сброс</button>
        </div>
    </div>
</div>

<div class="main">
    <div class="toolbar">
        <input type="text" id="search" placeholder="🔍 Поиск (Страна, Регион, Город)...">
    </div>
    <div class="tree-wrapper">
        <div class="tree-header">
            <div class="th-name">Категория</div>
            <div class="th-col">Строк</div>
            <div class="th-col" style="color:#2563eb">Тел</div>
            <div class="th-col" style="color:#16a34a">Email</div>
        </div>
        <div id="treeContainer"></div>
    </div>
</div>

<div class="loader" id="loader">
    <h3 style="color:#475569">Синхронизация с базой...</h3>
    <div style="color:#94a3b8; font-size:0.9rem; margin-top:5px" id="loaderMsg"></div>
</div>

<script>
    const TIERS = [
        { limit: 1000, rate: 0.10, name: "Новичок" }, { limit: 5000, rate: 0.075, name: "Старт" },
        { limit: 10000, rate: 0.06, name: "Активный" }, { limit: 50000, rate: 0.04, name: "Бизнес" },
        { limit: 100000, rate: 0.03, name: "Профи" }, { limit: 300000, rate: 0.02, name: "Корп" },
        { limit: Infinity, rate: 0.005, name: "Опт" }
    ];
    const PRICE_STEP = 500;
    let treeData = [], selectedIds = new Set(), indeterminateIds = new Set(), idCounter = 0, debounceTimer;

    window.onload = () => {
        document.getElementById('search').addEventListener('input', debounceSearch);
        if (typeof STATIC_DB !== 'undefined') { initApp(STATIC_DB); } 
        else { document.getElementById('loaderMsg').innerText = "База обновляется, подождите 1 мин и обновите страницу..."; }
    };

    function initApp(rawData) {
        treeData = rawData.map(node => processNode(node, null));
        if (treeData[0]) { treeData[0].isRoot = true; treeData[0].expanded = true; }
        renderTree(treeData, document.getElementById('treeContainer'), 0);
        recalculate();
        document.getElementById('loader').style.display = 'none';
    }

    function processNode(node, parent) {
        const newNode = { id: idCounter++, name: node.name, stats: node.stats, children: [], expanded: false, visible: true, parent: parent };
        if (node.children) newNode.children = node.children.map(child => processNode(child, newNode));
        return newNode;
    }

    function toggleSelect(node, state) {
        function setChildren(n, s) {
            if (s) { selectedIds.add(n.id); indeterminateIds.delete(n.id); } else { selectedIds.delete(n.id); indeterminateIds.delete(n.id); }
            if (n.children) n.children.forEach(c => setChildren(c, s));
        }
        setChildren(node, state);
        let curr = node.parent;
        while (curr) { updateParent(curr); curr = curr.parent; }
    }

    function updateParent(node) {
        if (!node.children) return;
        let all = true, none = true;
        node.children.forEach(c => {
            const sel = selectedIds.has(c.id);
            const ind = indeterminateIds.has(c.id);
            if (!sel) all = false;
            if (sel || ind) none = false;
        });
        if (all) { selectedIds.add(node.id); indeterminateIds.delete(node.id); }
        else if (none) { selectedIds.delete(node.id); indeterminateIds.delete(node.id); }
        else { selectedIds.delete(node.id); indeterminateIds.add(node.id); }
    }

    function renderTree(nodes, container, depth) {
        const ul = document.createElement('ul');
        nodes.forEach(node => {
            if (!node.visible || node.stats.l === 0) return;
            const li = document.createElement('li');
            const hasChild = node.children && node.children.length > 0;
            const sel = selectedIds.has(node.id);
            const ind = indeterminateIds.has(node.id);
            const row = document.createElement('div');
            row.className = `node-row ${sel ? 'selected' : ''} ${ind ? 'indeterminate' : ''} ${node.isRoot ? 'is-root-node' : ''}`;
            const left = document.createElement('div');
            left.className = 'row-left';
            left.style.paddingLeft = (depth * 20) + 'px';
            const toggler = document.createElement('div');
            toggler.className = 'toggler';
            toggler.innerHTML = hasChild ? (node.expanded ? '▼' : '▶') : '';
            if (!hasChild) toggler.style.pointerEvents = 'none';
            const chk = document.createElement('input');
            chk.type = 'checkbox';
            chk.checked = sel;
            chk.indeterminate = ind;
            const name = document.createElement('div');
            name.className = 'node-name';
            name.innerText = node.name;
            left.append(toggler, chk, name);
            const right = document.createElement('div');
            right.className = 'row-right';
            right.innerHTML = `<div class="badge b-lines">${node.stats.l.toLocaleString()}</div><div class="badge b-phones">${node.stats.p.toLocaleString()}</div><div class="badge b-emails">${node.stats.e.toLocaleString()}</div>`;
            row.append(left, right);
            li.appendChild(row);
            const onToggle = (e) => {
                e.stopPropagation(); if (!hasChild) return;
                node.expanded = !node.expanded;
                document.getElementById('treeContainer').innerHTML = '';
                renderTree(treeData, document.getElementById('treeContainer'), 0);
            };
            const onCheck = (e) => {
                e.stopPropagation();
                toggleSelect(node, !sel);
                document.getElementById('treeContainer').innerHTML = '';
                renderTree(treeData, document.getElementById('treeContainer'), 0);
                recalculate();
            };
            toggler.onclick = onToggle; chk.onclick = onCheck; row.onclick = (e) => { if (e.target !== chk && e.target !== toggler) onCheck(e); };
            if (node.expanded && hasChild) {
                const childCont = document.createElement('div');
                renderTree(node.children, childCont, depth + 1);
                li.appendChild(childCont);
            }
            ul.appendChild(li);
        });
        container.appendChild(ul);
    }

    function recalculate() {
        let l=0, p=0, e=0;
        function trav(nodes) {
            nodes.forEach(n => {
                if (selectedIds.has(n.id)) { l+=n.stats.l; p+=n.stats.p; e+=n.stats.e; }
                else if (indeterminateIds.has(n.id) || (n.children && n.children.length)) trav(n.children);
            });
        }
        trav(treeData);
        const vol = l + p + e;
        let cur = TIERS[0], tIdx = 0;
        for (let i=0; i<TIERS.length; i++) { if (vol < TIERS[i].limit) { cur = TIERS[i]; tIdx=i; break; } }
        if (vol >= TIERS[TIERS.length-1].limit) { cur = TIERS[TIERS.length-1]; tIdx=TIERS.length-1; }
        const raw = vol * cur.rate;
        let final = Math.ceil(raw / PRICE_STEP) * PRICE_STEP;
        if (final === 0 && vol > 0) final = PRICE_STEP;
        document.getElementById('totalPrice').innerText = final.toLocaleString();
        
        const bonusBox = document.getElementById('bonusBox');
        const fill = document.getElementById('bucketFill');
        const bTitle = document.getElementById('bonusTitle');
        const bText = document.getElementById('bonusText');
        if (vol === 0) {
            bonusBox.className = 'bonus-box'; bTitle.innerText = "Выберите базы"; bText.innerText = "Начните выбирать регионы."; fill.style.width = '0%';
        } else {
            bonusBox.className = 'bonus-box active';
            const maxVol = Math.floor(final / cur.rate);
            const free = maxVol - vol;
            const pct = Math.round((vol / maxVol) * 100);
            bTitle.innerText = "Пакет активен!";
            fill.style.width = pct + '%';
            if (free > 0) bText.innerHTML = `В цену входит еще <b>${free.toLocaleString()}</b> строк бесплатно!`;
            else bText.innerHTML = "Пакет заполнен на 100%.";
        }
        const tList = document.getElementById('tierList');
        tList.innerHTML = '';
        TIERS.forEach((t, i) => {
            const div = document.createElement('div');
            let cls = 'tier-item';
            if (i < tIdx) cls += ' passed'; if (i === tIdx) cls += ' current';
            div.className = cls;
            div.innerHTML = `<span>${t.name} (${t.limit >= Infinity ? '∞' : t.limit/1000 + 'k'})</span> <span>${t.rate}₽</span>`;
            tList.appendChild(div);
        });
    }

    function resetAll() { selectedIds.clear(); indeterminateIds.clear(); document.getElementById('treeContainer').innerHTML = ''; renderTree(treeData, document.getElementById('treeContainer'), 0); recalculate(); }
    function debounceSearch() { clearTimeout(debounceTimer); debounceTimer = setTimeout(runSearch, 300); }
    function runSearch() {
        const q = document.getElementById('search').value.toLowerCase();
        const filter = (n) => {
            let match = n.name.toLowerCase().includes(q);
            let childMatch = false;
            if (n.children) n.children.forEach(c => { if(filter(c)) childMatch = true; });
            n.visible = match || childMatch;
            if (q && childMatch) n.expanded = true; else if (!q) n.expanded = !!n.isRoot;
            return n.visible;
        };
        treeData.forEach(filter);
        document.getElementById('treeContainer').innerHTML = '';
        renderTree(treeData, document.getElementById('treeContainer'), 0);
    }
    
    function getPath(node) {
        let path = [];
        let curr = node;
        while (curr && !curr.isRoot) { path.unshift(curr.name); curr = curr.parent; }
        return path.join(" / ");
    }

    function downloadOrder() {
        if (selectedIds.size === 0 && indeterminateIds.size === 0) { alert('Пусто!'); return; }
        let text = `ЗАКАЗ\nСумма: ${document.getElementById('totalPrice').innerText} руб\n---\n`;
        const write = (nodes) => {
            nodes.forEach(n => {
                if (selectedIds.has(n.id)) text += `[+] ${getPath(n)} (L:${n.stats.l} P:${n.stats.p} E:${n.stats.e})\n`;
                else if (n.children) write(n.children);
            });
        };
        write(treeData);
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([text], {type: 'text/plain'}));
        a.download = 'Order.txt';
        a.click();
    }
</script>

</body>
</html>
