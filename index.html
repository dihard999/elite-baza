<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>База Данных: Калькулятор Заказа</title>
    <style>
        :root {
            --primary: #2563eb;
            --bg-body: #f1f5f9;
            --bg-panel: #ffffff;
            --text-main: #334155;
            --text-muted: #94a3b8;
            --border: #e2e8f0;
            --success: #10b981;
            --warning: #f59e0b;
            --info: #3b82f6;
        }

        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg-body); color: var(--text-main); margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* --- SIDEBAR (Left) --- */
        .sidebar { width: 340px; background: var(--bg-panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; z-index: 20; box-shadow: 4px 0 24px rgba(0,0,0,0.05); }
        .sidebar-header { padding: 20px; border-bottom: 1px solid var(--border); }
        .sidebar-header h2 { margin: 0; font-size: 1.2rem; color: var(--text-main); }
        .sidebar-content { padding: 20px; overflow-y: auto; flex: 1; }

        /* Price Inputs */
        .price-settings { background: #f8fafc; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid var(--border); }
        .price-settings h4 { margin: 0 0 10px 0; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); }
        .input-group { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .input-group label { font-size: 0.9rem; }
        .input-group input { width: 80px; padding: 4px 8px; border: 1px solid var(--border); border-radius: 4px; text-align: right; }

        /* Total Scoreboard */
        .score-card { background: white; border: 1px solid var(--border); border-radius: 8px; padding: 15px; margin-bottom: 10px; }
        .score-row { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 0.95rem; }
        .score-val { font-weight: 600; font-variant-numeric: tabular-nums; }
        
        .total-price-box { background: var(--primary); color: white; padding: 20px; border-radius: 12px; margin-top: 10px; text-align: center; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3); }
        .total-price-label { font-size: 0.85rem; opacity: 0.9; margin-bottom: 5px; }
        .total-price-val { font-size: 2rem; font-weight: 800; line-height: 1; }
        .currency { font-size: 1rem; font-weight: normal; }

        /* Actions */
        .actions { margin-top: auto; padding-top: 20px; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; margin-bottom: 10px; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-download { background: var(--text-main); color: white; }
        .btn-download:hover { background: #1e293b; }
        .btn-reset { background: #fee2e2; color: #991b1b; }
        .btn-reset:hover { background: #fecaca; }

        /* --- MAIN AREA (Right) --- */
        .main { flex: 1; display: flex; flex-direction: column; height: 100%; }
        
        .toolbar { padding: 15px 25px; background: var(--bg-panel); border-bottom: 1px solid var(--border); display: flex; gap: 15px; align-items: center; }
        .search-box { flex: 1; padding: 10px 15px; border: 1px solid var(--border); border-radius: 8px; font-size: 1rem; background: #f8fafc; }
        .search-box:focus { outline: 2px solid var(--primary); background: white; }

        .tree-container { flex: 1; overflow-y: auto; padding: 20px 25px; }

        /* Tree Nodes */
        ul { list-style: none; padding-left: 22px; margin: 0; }
        ul.root { padding-left: 0; }
        li { margin: 4px 0; }

        .node-row { display: flex; align-items: center; padding: 6px 10px; background: white; border: 1px solid transparent; border-radius: 6px; transition: 0.1s; }
        .node-row:hover { border-color: var(--border); background: #f8fafc; }
        .node-row.selected-bg { background: #eff6ff; border-color: #dbeafe; }

        /* Toggler & Checkbox */
        .toggler { width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; margin-right: 8px; color: var(--text-muted); cursor: pointer; font-size: 0.8rem; border-radius: 4px; transition: 0.2s; }
        .toggler:hover { background: #e2e8f0; color: var(--text-main); }
        .toggler.empty { opacity: 0; pointer-events: none; }
        
        input[type="checkbox"] { width: 16px; height: 16px; margin-right: 12px; cursor: pointer; accent-color: var(--primary); }

        /* Content */
        .node-name { flex: 1; font-weight: 500; font-size: 0.95rem; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-right: 15px; }
        
        /* Badges */
        .badges { display: flex; gap: 6px; }
        .badge { font-size: 0.75rem; padding: 2px 6px; border-radius: 4px; font-family: monospace; font-weight: 600; display: flex; align-items: center; min-width: 60px; justify-content: flex-end; }
        .b-lines { background: #f1f5f9; color: var(--text-muted); }
        .b-phones { background: #dbeafe; color: var(--info); }
        .b-emails { background: #d1fae5; color: var(--success); }
        .b-label { margin-right: auto; opacity: 0.6; font-weight: normal; font-size: 0.7rem; margin-right: 4px;}

        ul.nested { display: none; }
        ul.nested.active { display: block; border-left: 1px solid #e2e8f0; margin-left: 9px; }

        /* Loader */
        .loader-overlay { position: fixed; inset: 0; background: rgba(255,255,255,0.9); z-index: 100; display: flex; justify-content: center; align-items: center; flex-direction: column; }
        .spinner { width: 40px; height: 40px; border: 4px solid #e2e8f0; border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error-msg { color: #dc2626; background: #fee2e2; padding: 15px; border-radius: 8px; margin-top: 20px; display: none; max-width: 400px; text-align: center; }

    </style>
</head>
<body>

<div class="sidebar">
    <div class="sidebar-header">
        <h2>📂 Data Calculator</h2>
        <div style="font-size:0.8rem; color:#94a3b8; margin-top:4px;">Город: Москва</div>
    </div>
    
    <div class="sidebar-content">
        <div class="price-settings">
            <h4>Настройки Цены (₽)</h4>
            <div class="input-group">
                <label>За Строку:</label>
                <input type="number" id="priceLine" value="0.5" min="0" step="0.1" onchange="recalculate()">
            </div>
            <div class="input-group">
                <label>За Телефон:</label>
                <input type="number" id="pricePhone" value="2" min="0" step="0.1" onchange="recalculate()">
            </div>
            <div class="input-group">
                <label>За Email:</label>
                <input type="number" id="priceEmail" value="5" min="0" step="0.1" onchange="recalculate()">
            </div>
        </div>

        <div class="score-card">
            <div class="score-row">
                <span style="color:#64748b">Строк:</span>
                <span class="score-val" id="totalLines">0</span>
            </div>
            <div class="score-row">
                <span style="color:#3b82f6">Телефонов:</span>
                <span class="score-val" id="totalPhones">0</span>
            </div>
            <div class="score-row">
                <span style="color:#10b981">Email:</span>
                <span class="score-val" id="totalEmails">0</span>
            </div>
        </div>

        <div class="total-price-box">
            <div class="total-price-label">Итоговая стоимость</div>
            <div class="total-price-val"><span id="totalPrice">0</span> <span class="currency">₽</span></div>
        </div>

        <div class="actions">
            <button class="btn btn-download" onclick="downloadSelection()">
                ⬇ Скачать список (.txt)
            </button>
            <button class="btn btn-reset" onclick="resetAll()">
                ↺ Сбросить
            </button>
        </div>
    </div>
</div>

<div class="main">
    <div class="toolbar">
        <input type="text" id="searchInput" class="search-box" placeholder="🔍 Поиск категорий (например: Строительство)..." oninput="debounceSearch()">
    </div>
    
    <div class="tree-container" id="treeRoot">
        </div>
</div>

<div class="loader-overlay" id="loader">
    <div class="spinner"></div>
    <div style="margin-top:15px; font-weight:600; color:#334155;">Загрузка базы данных...</div>
    <div id="errorText" class="error-msg"></div>
</div>

<script>
    // === CONFIGURATION ===
    const DATA_FILE = 'Moscow.txt'; // <-- Имя вашего файла с базой

    let treeData = [];
    let selectedIds = new Set();
    let debounceTimer;

    // === 1. INIT & LOAD ===
    window.onload = async function() {
        try {
            const response = await fetch(DATA_FILE);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const text = await response.text();
            
            treeData = parseData(text);
            renderTree(treeData, document.getElementById('treeRoot'));
            document.getElementById('loader').style.display = 'none';
        } catch (err) {
            document.querySelector('.spinner').style.display = 'none';
            const errDiv = document.getElementById('errorText');
            errDiv.style.display = 'block';
            errDiv.innerHTML = `Не удалось загрузить <b>${DATA_FILE}</b>.<br>Убедитесь, что файл загружен на GitHub и имя совпадает.`;
        }
    };

    // === 2. PARSER ===
    function parseData(text) {
        const lines = text.split('\n');
        const root = [];
        const stack = [{ level: -1, children: root }];
        let idCounter = 0;
        
        // Matches: "Name [Строк: 10 | Тел: 5 | Email: 2]" OR "Name [0]"
        const regex = /\[(?:Строк:\s*(\d+)\s*\|\s*Тел:\s*(\d+)\s*\|\s*Email:\s*(\d+)|0)\]\s*$/;

        lines.forEach(line => {
            if (!line.trim() || line.startsWith('=')) return;
            
            const level = line.search(/\S/);
            if (level === -1) return;

            const content = line.trim();
            const match = content.match(regex);
            
            let name = content;
            let stats = { l: 0, p: 0, e: 0 };

            if (match) {
                name = content.substring(0, match.index).trim();
                if (match[1]) {
                    stats.l = parseInt(match[1]) || 0;
                    stats.p = parseInt(match[2]) || 0;
                    stats.e = parseInt(match[3]) || 0;
                }
            }

            const node = {
                id: idCounter++,
                name: name,
                stats: stats,
                children: [],
                visible: true,
                expanded: false
            };

            while (stack.length > 1 && stack[stack.length - 1].level >= level) stack.pop();
            stack[stack.length - 1].children.push(node);
            stack.push({ level: level, children: node.children });
        });
        return root;
    }

    // === 3. RENDER ===
    function renderTree(nodes, container) {
        const ul = document.createElement('ul');
        if (container.id === 'treeRoot') ul.className = 'root';
        else ul.className = 'nested';
        
        nodes.forEach(node => {
            if (!node.visible) return;

            const li = document.createElement('li');
            const hasChildren = node.children.length > 0;

            const row = document.createElement('div');
            row.className = 'node-row';
            if (selectedIds.has(node.id)) row.classList.add('selected-bg');

            // 1. Toggler
            const toggler = document.createElement('span');
            toggler.className = `toggler ${hasChildren ? '' : 'empty'}`;
            toggler.innerHTML = node.expanded ? '▼' : '▶'; // Modern arrows
            
            // 2. Checkbox
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.checked = selectedIds.has(node.id);
            checkbox.onchange = (e) => toggleSelect(node, e.target.checked, row);

            // 3. Name
            const nameSpan = document.createElement('span');
            nameSpan.className = 'node-name';
            nameSpan.innerText = node.name;

            // 4. Badges
            const badges = document.createElement('div');
            badges.className = 'badges';
            badges.innerHTML = `
                <div class="badge b-lines" title="Строк"><span class="b-label">L</span>${node.stats.l}</div>
                <div class="badge b-phones" title="Телефонов"><span class="b-label">P</span>${node.stats.p}</div>
                <div class="badge b-emails" title="Email"><span class="b-label">E</span>${node.stats.e}</div>
            `;

            // Append all
            row.append(toggler, checkbox, nameSpan, badges);
            li.appendChild(row);

            // Toggle logic
            const toggleAction = () => {
                if (!hasChildren) return;
                node.expanded = !node.expanded;
                toggler.innerHTML = node.expanded ? '▼' : '▶';
                
                let childUl = li.querySelector('ul.nested');
                if (!childUl) {
                    renderTree(node.children, li);
                    childUl = li.querySelector('ul.nested');
                }
                
                if (node.expanded) childUl.classList.add('active');
                else childUl.classList.remove('active');
            };

            toggler.onclick = toggleAction;
            nameSpan.onclick = toggleAction;

            // Pre-expand if search is active or state is expanded
            if (node.expanded && hasChildren) {
                 renderTree(node.children, li);
                 li.querySelector('ul.nested').classList.add('active');
            }

            ul.appendChild(li);
        });
        container.appendChild(ul);
    }

    // === 4. LOGIC ===
    function toggleSelect(node, isChecked, rowDiv) {
        if (isChecked) {
            selectedIds.add(node.id);
            rowDiv.classList.add('selected-bg');
        } else {
            selectedIds.delete(node.id);
            rowDiv.classList.remove('selected-bg');
        }
        recalculate();
    }

    function recalculate() {
        let tLines = 0, tPhones = 0, tEmails = 0;

        function traverse(nodes) {
            nodes.forEach(n => {
                if (selectedIds.has(n.id)) {
                    // If selected, add stats and STOP (don't add children)
                    tLines += n.stats.l;
                    tPhones += n.stats.p;
                    tEmails += n.stats.e;
                } else {
                    // Not selected, check children
                    if (n.children.length > 0) traverse(n.children);
                }
            });
        }
        traverse(treeData);

        // Update counts
        animateVal('totalLines', tLines);
        animateVal('totalPhones', tPhones);
        animateVal('totalEmails', tEmails);

        // Calculate Price
        const pLine = parseFloat(document.getElementById('priceLine').value) || 0;
        const pPhone = parseFloat(document.getElementById('pricePhone').value) || 0;
        const pEmail = parseFloat(document.getElementById('priceEmail').value) || 0;

        const totalCost = (tLines * pLine) + (tPhones * pPhone) + (tEmails * pEmail);
        document.getElementById('totalPrice').innerText = Math.round(totalCost).toLocaleString();
    }

    function animateVal(id, end) {
        document.getElementById(id).innerText = end.toLocaleString();
    }

    function resetAll() {
        selectedIds.clear();
        // Force re-render to clear checkboxes
        document.getElementById('treeRoot').innerHTML = '';
        renderTree(treeData, document.getElementById('treeRoot'));
        recalculate();
    }

    function debounceSearch() {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(performSearch, 300);
    }

    function performSearch() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        
        function filter(node) {
            let match = node.name.toLowerCase().includes(query);
            let childMatch = false;
            if (node.children.length) {
                node.children.forEach(c => {
                    if (filter(c)) childMatch = true;
                });
            }
            node.visible = match || childMatch;
            // If searching, auto-expand path
            if (query && childMatch) node.expanded = true; 
            else if (!query) node.expanded = false; // collapse on clear
            
            return node.visible;
        }

        treeData.forEach(filter);
        document.getElementById('treeRoot').innerHTML = '';
        renderTree(treeData, document.getElementById('treeRoot'));
    }

    // === 5. EXPORT / DOWNLOAD ===
    function downloadSelection() {
        if (selectedIds.size === 0) {
            alert("Пожалуйста, выберите хотя бы одну категорию.");
            return;
        }

        let content = "ЗАКАЗ НА ВЫГРУЗКУ\n=================\n";
        content += `Город: Москва\n`;
        content += `Дата: ${new Date().toLocaleString()}\n`;
        content += `Итого стоимость: ${document.getElementById('totalPrice').innerText} руб.\n`;
        content += "-----------------\nВЫБРАННЫЕ КАТЕГОРИИ:\n\n";

        function traverseWrite(nodes) {
            nodes.forEach(n => {
                if (selectedIds.has(n.id)) {
                    content += `[x] ${n.name} (L:${n.stats.l} P:${n.stats.p} E:${n.stats.e})\n`;
                } else {
                    if (n.children.length) traverseWrite(n.children);
                }
            });
        }
        traverseWrite(treeData);

        const blob = new Blob([content], { type: 'text/plain' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = "Order_Moscow.txt";
        a.click();
        window.URL.revokeObjectURL(url);
    }
</script>

</body>
</html>
