<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base Explorer</title>
    <script src="database.js"></script>
    <style>
        :root { --bg: #f8fafc; --white: #fff; --text: #0f172a; --border: #e2e8f0; --primary: #2563eb; --accent: #16a34a; }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        .sidebar { width: 360px; background: var(--white); border-right: 1px solid var(--border); display: flex; flex-direction: column; z-index: 10; }
        .sidebar-content { padding: 20px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 15px; }
        
        .total-card { background: linear-gradient(135deg, #2563eb, #1d4ed8); color: white; padding: 20px; border-radius: 12px; text-align: center; }
        .total-price { font-size: 2.5rem; font-weight: 800; line-height: 1; }
        .total-step { font-size: 0.75rem; opacity: 0.8; margin-top: 5px; text-transform: uppercase; letter-spacing: 1px;}

        .tier-list { border-top: 1px solid var(--border); padding-top: 15px; display: flex; flex-direction: column; gap: 5px; }
        .tier-row { display: flex; justify-content: space-between; padding: 6px 10px; font-size: 0.85rem; border-radius: 6px; color: #64748b; }
        .tier-row.active { background: #eff6ff; color: var(--primary); font-weight: 700; }

        .btn { width: 100%; padding: 12px; background: #0f172a; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; margin-top: auto; }
        
        .main { flex: 1; display: flex; flex-direction: column; background: var(--white); }
        .top-bar { padding: 15px 25px; border-bottom: 1px solid var(--border); background: #f8fafc; display: flex; flex-direction: column; gap: 10px; }
        
        .geo-selects { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        select { padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; width: 100%; background: white; }
        select:disabled { background: #f1f5f9; color: #94a3b8; }

        .tree-header { display: flex; padding: 10px 25px; border-bottom: 1px solid var(--border); font-size: 0.75rem; font-weight: 700; text-transform: uppercase; color: #64748b; background: #fff; }
        .col-name { flex: 1; } .col-stat { width: 80px; text-align: center; }

        .tree-view { flex: 1; overflow-y: auto; padding: 0 25px 20px 25px; }
        ul { list-style: none; padding: 0; margin: 0; }
        .node { display: flex; align-items: center; padding: 5px 0; border-bottom: 1px solid #f1f5f9; cursor: pointer; }
        .node:hover { background: #f8fafc; }
        .node.selected { background: #eff6ff; }
        .node.partly { background: #fff7ed; }
        
        .toggler { width: 20px; text-align: center; color: #94a3b8; margin-right: 5px; }
        input[type="checkbox"] { margin-right: 10px; cursor: pointer; }
        .name { flex: 1; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .stat { width: 80px; text-align: center; font-size: 0.85rem; font-weight: 600; }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="sidebar-content">
        <div class="total-card">
            <div style="font-size:0.75rem; text-transform:uppercase; opacity:0.8; margin-bottom:5px">К оплате</div>
            <div class="total-price"><span id="price">0</span>₽</div>
            <div class="total-step">Шаг 500₽</div>
        </div>
        <div class="tier-list" id="tiers"></div>
        <div class="actions">
            <button class="btn" onclick="download()">⬇ Скачать заказ</button>
            <button class="btn" style="background:white; color:#ef4444; border:1px solid #fecaca; margin-top:10px" onclick="reset()">Сброс</button>
        </div>
    </div>
</div>

<div class="main">
    <div class="top-bar">
        <input type="text" id="search" placeholder="🔍 Поиск категории..." style="width:100%; padding:10px; border:1px solid #cbd5e1; border-radius:6px">
        <div class="geo-selects">
            <select id="sCountry"><option value="">🌍 Страна</option></select>
            <select id="sRegion" disabled><option value="">🏳️ Регион</option></select>
            <select id="sDistrict" disabled><option value="">🏙️ Район</option></select>
            <select id="sCity" disabled><option value="">📍 Город</option></select>
        </div>
    </div>
    <div class="tree-header">
        <div class="col-name">Категория</div>
        <div class="col-stat">Строк</div>
        <div class="col-stat" style="color:var(--primary)">Тел</div>
        <div class="col-stat" style="color:var(--accent)">Email</div>
    </div>
    <div class="tree-view" id="tree"></div>
</div>

<script>
    const TIERS = [
        { l: 1000, r: 0.10, n: "Новичок" }, { l: 5000, r: 0.075, n: "Старт" },
        { l: 10000, r: 0.06, n: "Активный" }, { l: 50000, r: 0.04, n: "Бизнес" },
        { l: Infinity, r: 0.005, n: "Опт" }
    ];
    let fullDB = null, activeTree = [], selected = new Set(), semi = new Set(), uid = 0;
    const S = { c: document.getElementById('sCountry'), r: document.getElementById('sRegion'), d: document.getElementById('sDistrict'), t: document.getElementById('sCity') };

    window.onload = () => {
        if(typeof GEO_DB !== 'undefined') {
            fullDB = GEO_DB;
            fill(S.c, fullDB.children);
            updateTree(fullDB); // Показываем всё сразу
        } else alert('database.js не найден');
        
        document.getElementById('search').oninput = (e) => render(activeTree, document.getElementById('tree'), 0, e.target.value);
    };

    // --- GEO LOGIC ---
    S.c.onchange = () => { 
        const n = find(fullDB.children, S.c.value); 
        reset(['r','d','t']); 
        if(n) { fill(S.r, n.children); S.r.disabled=false; updateTree(n); } else updateTree(fullDB); 
    };
    S.r.onchange = () => {
        const c = find(fullDB.children, S.c.value);
        const n = find(c.children, S.r.value);
        reset(['d','t']);
        if(n) { fill(S.d, n.children); S.d.disabled=false; updateTree(n); }
    };
    S.d.onchange = () => {
        const c = find(fullDB.children, S.c.value);
        const r = find(c.children, S.r.value);
        const n = find(r.children, S.d.value);
        reset(['t']);
        if(n) { fill(S.t, n.children); S.t.disabled=false; updateTree(n); }
    };
    S.t.onchange = () => {
        const c = find(fullDB.children, S.c.value);
        const r = find(c.children, S.r.value);
        const d = find(r.children, S.d.value);
        const n = find(d.children, S.t.value);
        if(n) updateTree(n);
    };

    function find(arr, name) { return arr ? arr.find(x => x.name === name) : null; }
    function fill(el, arr) { 
        el.innerHTML = '<option value="">'+el.options[0].text+'</option>';
        if(arr) arr.forEach(x => { if(x.type==='folder' || x.type==='file') el.add(new Option(x.name, x.name)); });
    }
    function reset(keys) { keys.forEach(k => { S[k].value=""; S[k].disabled=true; S[k].innerHTML='<option value="">'+S[k].options[0].text+'</option>'; }); }

    // --- TREE AGGREGATION ---
    function updateTree(geoNode) {
        // 1. Находим все "file_content" внутри выбранной папки
        let contents = [];
        collect(geoNode, contents);
        // 2. Мержим их в одно дерево
        let merged = [];
        contents.forEach(tree => merge(merged, tree));
        // 3. Добавляем ID
        uid = 0; selected.clear(); semi.clear();
        activeTree = mapIds(merged, null);
        render(activeTree, document.getElementById('tree'), 0);
        calc();
    }

    function collect(node, list) {
        if(node.file_content) list.push(node.file_content);
        if(node.children) node.children.forEach(c => collect(c, list));
    }

    function merge(target, source) {
        source.forEach(sNode => {
            let tNode = target.find(x => x.name === sNode.name);
            if(!tNode) {
                tNode = JSON.parse(JSON.stringify(sNode));
                tNode.children = []; // Детей мержим отдельно
                tNode.stats = {...sNode.stats}; // Копия
                target.push(tNode);
            } else {
                tNode.stats.l += sNode.stats.l;
                tNode.stats.p += sNode.stats.p;
                tNode.stats.e += sNode.stats.e;
            }
            if(sNode.children) merge(tNode.children, sNode.children);
        });
    }

    function mapIds(nodes, parent) {
        return nodes.map(n => {
            const node = { ...n, id: uid++, parent: parent };
            if(n.children) node.children = mapIds(n.children, node);
            return node;
        });
    }

    // --- RENDER & LOGIC ---
    function render(nodes, box, depth, filter="") {
        if(depth===0) box.innerHTML = '';
        const ul = document.createElement('ul');
        nodes.forEach(n => {
            if(filter && !n.name.toLowerCase().includes(filter.toLowerCase()) && !hasMatch(n, filter)) return;
            if(n.stats.l === 0) return;

            const li = document.createElement('li');
            const row = document.createElement('div');
            const isSel = selected.has(n.id);
            const isSemi = semi.has(n.id);
            
            row.className = `node ${isSel?'selected':''} ${isSemi?'partly':''}`;
            row.style.paddingLeft = (depth*20) + 'px';
            
            const tog = document.createElement('span');
            tog.className = 'toggler';
            tog.innerHTML = n.children.length ? (n.expand ? '▼' : '▶') : '';
            tog.onclick = (e) => { e.stopPropagation(); n.expand = !n.expand; render(activeTree, box, 0, filter); };

            const chk = document.createElement('input');
            chk.type = 'checkbox';
            chk.checked = isSel; chk.indeterminate = isSemi;
            chk.onclick = (e) => { e.stopPropagation(); toggle(n, !isSel); render(activeTree, box, 0, filter); calc(); };

            row.append(tog, chk);
            row.innerHTML += `<div class="name">${n.name}</div>
                <div class="stat" style="color:#475569">${n.stats.l}</div>
                <div class="stat" style="color:var(--primary)">${n.stats.p}</div>
                <div class="stat" style="color:var(--accent)">${n.stats.e}</div>`;
            
            row.onclick = (e) => { if(e.target.tagName!=='INPUT') tog.click(); };
            
            li.appendChild(row);
            if(n.children.length && (n.expand || filter)) {
                const sub = document.createElement('div');
                li.appendChild(sub);
                // Рендерим детей в sub, но так как render чистит box при depth=0, тут хитрость:
                // Мы используем рекурсию для DOM
                // Проще: renderTreeFragment
                renderFragment(n.children, sub, depth+1, filter);
            }
            ul.appendChild(li);
        });
        box.appendChild(ul);
    }

    function renderFragment(nodes, box, depth, filter) {
        // Тот же код, только без очистки
        const ul = document.createElement('ul');
        nodes.forEach(n => {
            if(filter && !n.name.toLowerCase().includes(filter.toLowerCase()) && !hasMatch(n, filter)) return;
            if(n.stats.l === 0) return;
            const li = document.createElement('li');
            const row = document.createElement('div');
            const isSel = selected.has(n.id);
            const isSemi = semi.has(n.id);
            row.className = `node ${isSel?'selected':''} ${isSemi?'partly':''}`;
            row.style.paddingLeft = (depth*20) + 'px';
            
            const tog = document.createElement('span');
            tog.className = 'toggler';
            tog.innerHTML = n.children.length ? (n.expand ? '▼' : '▶') : '';
            tog.onclick = (e) => { e.stopPropagation(); n.expand = !n.expand; render(activeTree, document.getElementById('tree'), 0, filter); };

            const chk = document.createElement('input');
            chk.type = 'checkbox';
            chk.checked = isSel; chk.indeterminate = isSemi;
            chk.onclick = (e) => { e.stopPropagation(); toggle(n, !isSel); render(activeTree, document.getElementById('tree'), 0, filter); calc(); };

            row.append(tog, chk);
            row.innerHTML += `<div class="name">${n.name}</div><div class="stat" style="color:#475569">${n.stats.l}</div><div class="stat" style="color:var(--primary)">${n.stats.p}</div><div class="stat" style="color:var(--accent)">${n.stats.e}</div>`;
            li.appendChild(row);
            
            if(n.children.length && (n.expand || filter)) {
                const sub = document.createElement('div');
                li.appendChild(sub);
                renderFragment(n.children, sub, depth+1, filter);
            }
            ul.appendChild(li);
        });
        box.appendChild(ul);
    }

    function hasMatch(n, f) {
        if(n.name.toLowerCase().includes(f.toLowerCase())) return true;
        return n.children && n.children.some(c => hasMatch(c, f));
    }

    function toggle(n, s) {
        if(s) { selected.add(n.id); semi.delete(n.id); } else { selected.delete(n.id); semi.delete(n.id); }
        if(n.children) n.children.forEach(c => toggle(c, s));
        updateUp(n.parent);
    }
    function updateUp(n) {
        if(!n) return;
        let all=true, none=true;
        n.children.forEach(c => {
            if(!selected.has(c.id)) all=false;
            if(selected.has(c.id) || semi.has(c.id)) none=false;
        });
        if(all) { selected.add(n.id); semi.delete(n.id); }
        else if(none) { selected.delete(n.id); semi.delete(n.id); }
        else { selected.delete(n.id); semi.add(n.id); }
        updateUp(n.parent);
    }

    function calc() {
        let l=0,p=0,e=0;
        function trav(n) {
            if(selected.has(n.id)) { l+=n.stats.l; p+=n.stats.p; e+=n.stats.e; }
            else if(semi.has(n.id) || !n.parent) { if(n.children) n.children.forEach(trav); }
        }
        activeTree.forEach(trav); // start from roots
        
        let cur = TIERS[0], idx=0;
        const vol = l+p+e;
        for(let i=0; i<TIERS.length; i++) if(vol < TIERS[i].l) { cur=TIERS[i]; idx=i; break; }
        if(vol >= TIERS[TIERS.length-1].l) { cur=TIERS[TIERS.length-1]; idx=TIERS.length-1; }
        
        let final = Math.ceil((vol * cur.r) / PRICE_STEP) * PRICE_STEP;
        if(final===0 && vol>0) final=PRICE_STEP;
        
        document.getElementById('price').innerText = final.toLocaleString();
        document.getElementById('tiers').innerHTML = TIERS.map((t,i) => 
            `<div class="tier-row ${i===idx?'active':''}"><span>${t.n}</span><span>${t.r}₽</span></div>`
        ).join('');
    }

    function reset() { selected.clear(); semi.clear(); render(activeTree, document.getElementById('tree'), 0); calc(); }
    
    function download() {
        if(!selected.size && !semi.size) return alert('Пусто');
        let txt = `ЗАКАЗ\nРегион: ${S.c.value}/${S.r.value}/${S.t.value}\nЦена: ${document.getElementById('price').innerText}\n---\n`;
        function w(n) {
            if(selected.has(n.id)) txt += `[+] ${n.name} (${n.stats.l})\n`;
            else if(n.children) n.children.forEach(w);
        }
        activeTree.forEach(w);
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([txt], {type:'text/plain'}));
        a.download = 'Order.txt';
        a.click();
    }
</script>
</body>
</html>
