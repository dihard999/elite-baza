<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор Базы</title>
    <style>
        :root {
            --bg-body: #f8fafc;       
            --bg-sidebar: #ffffff;    
            --text-main: #1e293b;     
            --text-muted: #64748b;    
            --border: #e2e8f0;        
            
            /* Цвета */
            --c-lines-bg: #f1f5f9;    --c-lines-text: #475569; 
            --c-phones-bg: #dbeafe;   --c-phones-text: #1e40af; 
            --c-emails-bg: #dcfce7;   --c-emails-text: #166534; 
            
            --primary: #2563eb;
        }

        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; 
            background: var(--bg-body); 
            color: var(--text-main); 
            margin: 0; display: flex; height: 100vh; overflow: hidden; 
        }
        
        /* --- SIDEBAR --- */
        .sidebar { 
            width: 340px; background: var(--bg-sidebar); border-right: 1px solid var(--border); 
            display: flex; flex-direction: column; z-index: 20; 
            box-shadow: 10px 0 30px -10px rgba(0,0,0,0.05);
            padding-top: 20px; /* Отступ сверху вместо шапки */
        }

        .sidebar-content { padding: 25px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 20px;}

        /* TOTAL BOX */
        .total-box {
            background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%);
            color: white; padding: 35px 20px; border-radius: 16px; text-align: center;
            box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.4);
        }
        .total-label { font-size: 0.9rem; opacity: 0.8; margin-bottom: 5px; font-weight: 500; }
        .total-value { font-size: 2.8rem; font-weight: 800; line-height: 1.1; }

        /* SELECTED STATS (Новая панель) */
        .stats-summary {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.95rem;
            font-weight: 500;
            padding-bottom: 8px;
            border-bottom: 1px dashed var(--border);
        }
        .stat-row:last-child { border-bottom: none; padding-bottom: 0; }
        .stat-val { font-weight: 700; font-size: 1.1rem; }

        /* BUTTONS */
        .actions { margin-top: auto; }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; margin-bottom: 10px; }
        .btn-download { background: #1e293b; color: white; }
        .btn-reset { background: transparent; color: #ef4444; border: 1px solid #fecaca; }

        /* --- MAIN AREA --- */
        .main { flex: 1; display: flex; flex-direction: column; }
        
        .toolbar { padding: 20px 30px; background: var(--bg-sidebar); border-bottom: 1px solid var(--border); }
        .search-input { width: 100%; padding: 12px 20px; font-size: 1rem; border: 1px solid var(--border); border-radius: 10px; box-sizing: border-box; background: var(--bg-body);}

        /* TREE WRAPPER */
        .tree-wrapper { flex: 1; overflow-y: auto; padding: 0 30px 20px 30px; position: relative; }
        ul { list-style: none; padding: 0; margin: 0; }
        
        /* HEADER & ROW STRUCTURE */
        .row-structure { display: flex; align-items: center; padding: 8px 0; }
        .row-left { flex: 1; display: flex; align-items: center; overflow: hidden; padding-right: 15px; }
        .row-right { display: flex; gap: 8px; }
        .col-fixed { width: 80px; display: flex; justify-content: center; } 

        /* Sticky Header */
        .table-header {
            position: sticky; top: 0; z-index: 10;
            background: var(--bg-body); 
            padding-top: 20px; padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
            font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px;
        }
        .header-pad { padding-left: 58px; } 

        /* Data Node Row */
        .node-row { 
            cursor: pointer; transition: 0.1s; border-radius: 8px; padding-left: 4px; padding-right: 4px;
            border: 1px solid transparent;
        }
        .node-row:hover { background: #f1f5f9; }
        .node-row.selected { background: #eff6ff; border-color: #bfdbfe; }
        
        .node-row.is-root-node {
            background: #f8fafc; border-color: #cbd5e1; font-weight: 700; margin-bottom: 10px; margin-top: 10px;
        }
        .node-row.is-root-node.selected { background: #dbeafe; border-color: #2563eb; }

        .toggler { width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; margin-right: 8px; color: var(--text-muted); font-size: 0.8rem; flex-shrink: 0;}
        .toggler.empty { opacity: 0; }
        input[type="checkbox"] { width: 18px; height: 18px; margin-right: 15px; cursor: pointer; accent-color: var(--primary); flex-shrink: 0; }
        .node-name { font-weight: 500; font-size: 1rem; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* BADGES (Updated: No Icons) */
        .badge { 
            padding: 4px 0; /* Center align vertically */
            border-radius: 6px; font-size: 0.85rem; font-weight: 700; 
            display: flex; align-items: center; justify-content: center; /* Center content */
            width: 100%; box-sizing: border-box;
        }
        .b-lines { background: var(--c-lines-bg); color: var(--c-lines-text); }
        .b-phones { background: var(--c-phones-bg); color: var(--c-phones-text); }
        .b-emails { background: var(--c-emails-bg); color: var(--c-emails-text); }

        ul.nested { display: none; }
        
        /* Loader */
        .loader { position: fixed; inset: 0; background: rgba(255,255,255,0.95); z-index: 999; display: flex; justify-content: center; align-items: center; flex-direction: column; }
        .spinner { width: 50px; height: 50px; border: 4px solid #e2e8f0; border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error-box { display: none; color: #dc2626; background: #fee2e2; padding: 20px; border-radius: 8px; }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="sidebar-content">
        <div class="total-box">
            <div class="total-label">Итоговая стоимость</div>
            <div class="total-value"><span id="totalPrice">0</span>₽</div>
        </div>
        
        <div class="stats-summary">
            <div class="stat-row">
                <span style="color:var(--c-lines-text)">Выбрано строк:</span>
                <span class="stat-val" style="color:var(--c-lines-text)" id="selLines">0</span>
            </div>
            <div class="stat-row">
                <span style="color:var(--c-phones-text)">Телефонов:</span>
                <span class="stat-val" style="color:var(--c-phones-text)" id="selPhones">0</span>
            </div>
            <div class="stat-row">
                <span style="color:var(--c-emails-text)">Email:</span>
                <span class="stat-val" style="color:var(--c-emails-text)" id="selEmails">0</span>
            </div>
        </div>

        <div class="actions">
            <button class="btn btn-download" onclick="downloadOrder()">⬇ Скачать заказ (.txt)</button>
            <button class="btn btn-reset" onclick="resetAll()">Сбросить выбор</button>
        </div>
    </div>
</div>

<div class="main">
    <div class="toolbar">
        <input type="text" id="searchInput" class="search-input" placeholder="🔍 Поиск категории...">
    </div>
    
    <div class="tree-wrapper">
        <div class="table-header row-structure">
            <div class="row-left header-pad">Категория</div>
            <div class="row-right">
                <div class="col-fixed">Строк</div>
                <div class="col-fixed" style="color:var(--c-phones-text)">Телефонов</div>
                <div class="col-fixed" style="color:var(--c-emails-text)">Email</div>
            </div>
        </div>
        
        <div id="treeContainer"></div>
    </div>
</div>

<div class="loader" id="loader">
    <div class="spinner"></div>
    <h3 style="margin-top:20px; color:#475569;">Загрузка базы...</h3>
    <div id="errorText" class="error-box"></div>
</div>

<script>
    // === КОНФИГУРАЦИЯ ЦЕН ===
    const PRICE_LINE = 0.5;
    const PRICE_PHONE = 2.0;
    const PRICE_EMAIL = 5.0;

    const DATA_FILE = 'Moscow.txt';
    let treeData = [];
    let selectedIds = new Set();
    let debounceTimer;

    window.onload = async () => {
        document.getElementById('searchInput').addEventListener('input', debounceSearch);

        try {
            const resp = await fetch(DATA_FILE);
            if (!resp.ok) throw new Error('File error');
            const text = await resp.text();
            
            let rawNodes = parseHierarchy(text);
            
            if (rawNodes.length === 1) {
                treeData = rawNodes;
                treeData[0].name = "ВСЕ БАЗЫ"; 
                treeData[0].isRoot = true;    
                treeData[0].expanded = true;
            } else if (rawNodes.length > 1) {
                const totalStats = rawNodes.reduce((acc, node) => {
                    acc.l += node.stats.l;
                    acc.p += node.stats.p;
                    acc.e += node.stats.e;
                    return acc;
                }, { l:0, p:0, e:0 });

                const rootNode = {
                    id: 'ROOT_WRAPPER', 
                    name: 'ВСЕ БАЗЫ',
                    stats: totalStats,
                    children: rawNodes,
                    expanded: true,
                    visible: true,
                    isRoot: true
                };
                treeData = [rootNode];
            } else {
                 treeData = [];
            }

            renderTree(treeData, document.getElementById('treeContainer'), 0);
            document.getElementById('loader').style.display = 'none';
        } catch (e) {
            document.querySelector('.spinner').style.display = 'none';
            const err = document.getElementById('errorText');
            err.style.display = 'block';
            err.innerHTML = `Ошибка: файл <b>${DATA_FILE}</b> не найден.`;
        }
    };

    function parseHierarchy(text) {
        const lines = text.split('\n');
        const root = [];
        const stack = [{ level: -1, children: root }];
        let idCounter = 0;
        const regex = /\[(?:Строк:\s*(\d+)\s*\|\s*Тел:\s*(\d+)\s*\|\s*Email:\s*(\d+)|0)\]\s*$/;

        lines.forEach(line => {
            const cleanLine = line.trim();
            if (!cleanLine || cleanLine.startsWith('=') || cleanLine.startsWith('Всего')) return;

            const level = line.search(/\S/);
            if (level === -1) return;

            const match = cleanLine.match(regex);
            let name = cleanLine;
            let stats = { l:0, p:0, e:0 };

            if (match) {
                name = cleanLine.substring(0, match.index).trim();
                if (match[1]) {
                    stats.l = parseInt(match[1])||0;
                    stats.p = parseInt(match[2])||0;
                    stats.e = parseInt(match[3])||0;
                }
            }
            
            const node = { id: idCounter++, name, stats, children: [], expanded: false, visible: true };

            while (stack.length > 1 && stack[stack.length-1].level >= level) stack.pop();
            stack[stack.length-1].children.push(node);
            stack.push({ level, children: node.children });
        });
        return root;
    }

    function renderTree(nodes, container, depth) {
        const ul = document.createElement('ul');
        ul.className = (container.id === 'treeContainer') ? 'root' : 'nested';

        nodes.forEach(node => {
            if (!node.visible) return;
            const li = document.createElement('li');
            const hasChildren = node.children.length > 0;
            const isSelected = selectedIds.has(node.id);

            const row = document.createElement('div');
            row.className = `node-row row-structure ${isSelected ? 'selected' : ''} ${node.isRoot ? 'is-root-node' : ''}`;
            
            const leftDiv = document.createElement('div');
            leftDiv.className = 'row-left';
            leftDiv.style.paddingLeft = (depth * 20) + 'px'; 

            const toggler = document.createElement('div');
            toggler.className = `toggler ${hasChildren ? '' : 'empty'}`;
            toggler.innerHTML = node.expanded ? '▼' : '▶';
            
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.checked = isSelected;
            
            const nameDiv = document.createElement('div');
            nameDiv.className = 'node-name';
            nameDiv.innerText = node.name;
            
            leftDiv.append(toggler, checkbox, nameDiv);

            const rightDiv = document.createElement('div');
            rightDiv.className = 'row-right';
            
            // Helper: без букв, только цифры
            const createBadge = (type, val) => {
                const cell = document.createElement('div');
                cell.className = 'col-fixed';
                if (val > 0) {
                    cell.innerHTML = `<div class="badge b-${type}">${val.toLocaleString()}</div>`;
                } else {
                     cell.innerHTML = `<span style="opacity:0.3; font-size:0.8rem">—</span>`;
                }
                return cell;
            }

            rightDiv.append(
                createBadge('lines', node.stats.l),
                createBadge('phones', node.stats.p),
                createBadge('emails', node.stats.e)
            );

            row.append(leftDiv, rightDiv);
            li.appendChild(row);

            const toggleExpand = (e) => {
                e.stopPropagation();
                if (!hasChildren) return;
                node.expanded = !node.expanded;
                toggler.innerHTML = node.expanded ? '▼' : '▶';
                
                let childUl = li.querySelector('ul.nested');
                if (!childUl) { renderTree(node.children, li, depth + 1); childUl = li.querySelector('ul.nested'); }
                
                if (node.expanded) childUl.style.display = 'block';
                else childUl.style.display = 'none';
            };

            const toggleCheck = (e) => {
                e.stopPropagation();
                const checked = e.target.checked;
                const setRecursive = (n, s) => {
                    s ? selectedIds.add(n.id) : selectedIds.delete(n.id);
                    if (n.children) n.children.forEach(c => setRecursive(c, s));
                };
                setRecursive(node, checked);
                
                document.getElementById('treeContainer').innerHTML = '';
                renderTree(treeData, document.getElementById('treeContainer'), 0);
                recalculate();
            };

            toggler.onclick = toggleExpand;
            row.onclick = (e) => { if(e.target !== checkbox && !e.target.closest('.toggler')) toggleCheck(e); }; 
            checkbox.onclick = toggleCheck; 

            if (node.expanded && hasChildren) {
                renderTree(node.children, li, depth + 1);
                li.querySelector('ul.nested').style.display = 'block';
            }
            ul.appendChild(li);
        });
        container.appendChild(ul);
    }

    function recalculate() {
        let l=0, p=0, e=0;
        function traverse(nodes) {
            nodes.forEach(n => {
                if (selectedIds.has(n.id)) {
                    l += n.stats.l;
                    p += n.stats.p;
                    e += n.stats.e;
                } else {
                    if (n.children.length) traverse(n.children);
                }
            });
        }
        traverse(treeData);

        // Обновляем новую панель статистики
        document.getElementById('selLines').innerText = l.toLocaleString();
        document.getElementById('selPhones').innerText = p.toLocaleString();
        document.getElementById('selEmails').innerText = e.toLocaleString();

        const total = (l * PRICE_LINE) + (p * PRICE_PHONE) + (e * PRICE_EMAIL);
        document.getElementById('totalPrice').innerText = Math.round(total).toLocaleString();
    }

    function resetAll() {
        selectedIds.clear();
        document.getElementById('treeContainer').innerHTML = '';
        renderTree(treeData, document.getElementById('treeContainer'), 0);
        recalculate();
    }

    function debounceSearch() { clearTimeout(debounceTimer); debounceTimer = setTimeout(runSearch, 300); }

    function runSearch() {
        const q = document.getElementById('searchInput').value.toLowerCase();
        const filter = (node) => {
            const match = node.name.toLowerCase().includes(q);
            let childMatch = false;
            if (node.children.length) node.children.forEach(c => { if (filter(c)) childMatch = true; });
            node.visible = match || childMatch;
            if (q && childMatch) node.expanded = true;
            else if (!q) node.expanded = !!node.isRoot; 
            return node.visible;
        };
        treeData.forEach(filter);
        document.getElementById('treeContainer').innerHTML = '';
        renderTree(treeData, document.getElementById('treeContainer'), 0);
    }

    function downloadOrder() {
        if (selectedIds.size === 0) { alert('Ничего не выбрано!'); return; }
        let text = `ЗАКАЗ\nДата: ${new Date().toLocaleString()}\n`;
        text += `Сумма: ${document.getElementById('totalPrice').innerText} руб.\n`;
        text += `Статистика: Строк: ${document.getElementById('selLines').innerText}, Тел: ${document.getElementById('selPhones').innerText}, Email: ${document.getElementById('selEmails').innerText}\n---\n`;
        
        const traverseWrite = (nodes) => {
            nodes.forEach(n => {
                if (selectedIds.has(n.id)) text += `[+] ${n.name} (L:${n.stats.l} P:${n.stats.p} E:${n.stats.e})\n`;
                else if (n.children.length) traverseWrite(n.children);
            });
        };
        traverseWrite(treeData);
        const link = document.createElement('a');
        link.href = URL.createObjectURL(new Blob([text], {type: 'text/plain'}));
        link.download = 'Order.txt';
        link.click();
    }
</script>

</body>
</html>
