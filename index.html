<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Base Calculator: Final</title>
    <style>
        :root {
            --bg-body: #f1f5f9;       
            --bg-sidebar: #ffffff;    
            --text-main: #0f172a;     
            --text-muted: #64748b;    
            --border: #e2e8f0;        
            
            --c-lines-bg: #f8fafc;    --c-lines-text: #475569; 
            --c-phones-bg: #eff6ff;   --c-phones-text: #1d4ed8; 
            --c-emails-bg: #f0fdf4;   --c-emails-text: #15803d; 
            
            --primary: #3b82f6;
            --success: #22c55e;
            --success-bg: #ecfdf5;
            --success-border: #6ee7b7;
        }

        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; 
            background: var(--bg-body); 
            color: var(--text-main); 
            margin: 0; display: flex; height: 100vh; overflow: hidden; 
        }
        
        /* --- SIDEBAR --- */
        .sidebar { 
            width: 400px; 
            background: var(--bg-sidebar); border-right: 1px solid var(--border); 
            display: flex; flex-direction: column; z-index: 20; 
            box-shadow: 4px 0 24px rgba(0,0,0,0.05);
        }

        .sidebar-content { padding: 20px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 15px;}

        /* ЦЕНА */
        .total-box {
            background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%);
            color: white; padding: 20px; border-radius: 16px; text-align: center;
            box-shadow: 0 10px 20px -5px rgba(37, 99, 235, 0.4);
            flex-shrink: 0;
        }
        .total-label { font-size: 0.75rem; opacity: 0.9; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px;}
        .total-value { font-size: 2.8rem; font-weight: 800; line-height: 1; letter-spacing: -1px;}
        .total-step { font-size: 0.8rem; opacity: 0.7; margin-top: 5px; background: rgba(0,0,0,0.2); display: inline-block; padding: 2px 8px; border-radius: 4px;}

        /* БОНУС */
        .bonus-box {
            background: #f8fafc; border: 2px dashed #cbd5e1; border-radius: 12px; padding: 16px;
            transition: 0.3s all; flex-shrink: 0; display: flex; flex-direction: column; gap: 8px;
        }
        .bonus-box.active {
            background: var(--success-bg); border: 2px solid var(--success-border);
            box-shadow: 0 4px 12px -2px rgba(16, 185, 129, 0.2);
        }
        .bonus-header { display: flex; justify-content: space-between; align-items: center; color: var(--text-muted); font-weight: 700; font-size: 0.95rem; }
        .bonus-box.active .bonus-header { color: #047857; }
        .bonus-text { font-size: 0.9rem; color: var(--text-muted); line-height: 1.5; }
        .bonus-box.active .bonus-text { color: #065f46; }
        .bonus-highlight { color: var(--text-main); font-weight: 800; background: rgba(0,0,0,0.05); padding: 2px 6px; border-radius: 4px; display: inline-block; }
        .bonus-box.active .bonus-highlight { color: #059669; background: white; }
        .bucket-container { width: 100%; display: flex; flex-direction: column; gap: 4px; }
        .bucket-progress { height: 8px; background: #e2e8f0; border-radius: 4px; overflow: hidden; width: 100%; }
        .bucket-fill { height: 100%; background: #94a3b8; width: 0%; transition: width 0.3s; }
        .bonus-box.active .bucket-progress { background: #d1fae5; }
        .bonus-box.active .bucket-fill { background: #10b981; }

        /* СТАТИСТИКА */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; text-align: center; flex-shrink: 0;}
        .stat-item { background: white; padding: 10px 5px; border-radius: 10px; border: 1px solid var(--border); }
        .stat-num { display: block; font-weight: 800; font-size: 1rem; color: var(--text-main); margin-bottom: 2px; }
        .stat-lbl { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }

        /* ТАРИФЫ */
        .tier-section { border-top: 1px solid var(--border); padding-top: 15px; }
        .tier-title { font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); font-weight: 700; margin-bottom: 10px; padding-left: 5px; }
        .tier-list { display: flex; flex-direction: column; gap: 8px; }
        .tier-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 8px 12px; border-radius: 8px; background: white; border: 1px solid transparent;
            transition: 0.2s; font-size: 0.85rem; color: var(--text-muted);
        }
        .tier-item.passed { background: #f1f5f9; color: #94a3b8; text-decoration: line-through; }
        .tier-item.current { 
            background: #eff6ff; border: 1px solid #bfdbfe; color: #1e3a8a; 
            font-weight: 600; box-shadow: 0 2px 4px rgba(59, 130, 246, 0.1);
            position: relative; overflow: hidden;
        }
        .tier-item.current::after {
            content: ''; position: absolute; bottom: 0; left: 0; height: 3px; background: #3b82f6;
            width: var(--progress, 0%); transition: width 0.3s;
        }
        .tier-item.locked { background: white; border: 1px solid #f1f5f9; }
        .tier-rate { font-weight: 700; }
        .save-badge { font-size: 0.7rem; font-weight: 700; color: white; background: #10b981; padding: 2px 6px; border-radius: 4px; margin-left: 6px; }

        /* BUTTONS */
        .actions { margin-top: auto; padding-top: 10px; }
        
        /* HINT TEXT ABOVE BUTTON */
        .download-hint {
            font-size: 0.85rem; color: var(--text-muted); text-align: center; margin-bottom: 8px; font-weight: 500;
        }

        .btn { width: 100%; padding: 14px; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; margin-bottom: 10px; transition: 0.2s; font-size: 0.95rem; }
        .btn-download { background: #0f172a; color: white; display: flex; justify-content: center; align-items: center; gap: 8px; }
        .btn-download:hover { background: #1e293b; transform: translateY(-1px); }
        .btn-reset { background: white; color: #ef4444; border: 1px solid #fecaca; }
        .btn-reset:hover { background: #fef2f2; }

        /* MAIN AREA */
        .main { flex: 1; display: flex; flex-direction: column; background: white; }
        .toolbar { padding: 15px 30px; border-bottom: 1px solid var(--border); }
        .search-input { width: 100%; padding: 10px 15px; font-size: 1rem; border: 1px solid #cbd5e1; border-radius: 8px; background: #f8fafc; }
        .search-input:focus { background: white; border-color: var(--primary); outline: none; }

        .tree-wrapper { flex: 1; overflow-y: auto; padding: 0 30px 20px 30px; }
        ul { list-style: none; padding: 0; margin: 0; }
        
        .table-header {
            position: sticky; top: 0; z-index: 10; background: white; 
            padding-top: 20px; padding-bottom: 10px; border-bottom: 1px solid var(--border);
            font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px;
            display: flex;
        }
        .header-pad { padding-left: 50px; flex: 1; } 
        .col-fixed { width: 90px; text-align: center; }

        .node-row { display: flex; align-items: center; padding: 8px 0; border-radius: 6px; cursor: pointer; border-bottom: 1px solid #f1f5f9; }
        .node-row:hover { background: #f8fafc; }
        .node-row.selected { background: #eff6ff; }
        .node-row.is-root-node { background: #f8fafc; border-bottom: 2px solid #e2e8f0; font-weight: 700; margin-bottom: 10px; margin-top: 10px; padding: 12px 0; }
        .node-row.indeterminate { background: #fff7ed; } 
        .node-row.indeterminate input[type="checkbox"] { opacity: 0.6; }

        .row-left { flex: 1; display: flex; align-items: center; overflow: hidden; padding-right: 15px; }
        .row-right { display: flex; gap: 5px; }
        .toggler { width: 24px; display: flex; justify-content: center; margin-right: 8px; color: #94a3b8; flex-shrink: 0;}
        input[type="checkbox"] { width: 18px; height: 18px; margin-right: 12px; cursor: pointer; accent-color: var(--primary); flex-shrink: 0; }
        .node-name { font-weight: 500; font-size: 0.95rem; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .badge { padding: 4px 0; border-radius: 6px; font-size: 0.85rem; font-weight: 700; display: flex; justify-content: center; width: 100%; }
        .b-lines { color: var(--c-lines-text); }
        .b-phones { color: var(--c-phones-text); }
        .b-emails { color: var(--c-emails-text); }
        
        .loader { position: fixed; inset: 0; background: rgba(255,255,255,0.95); z-index: 999; display: flex; justify-content: center; align-items: center; flex-direction: column; }
        .spinner { width: 40px; height: 40px; border: 4px solid #e2e8f0; border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error-box { display: none; color: #dc2626; background: #fee2e2; padding: 20px; border-radius: 8px; }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="sidebar-content">
        <div class="total-box">
            <div class="total-label">К оплате</div>
            <div class="total-value"><span id="totalPrice">0</span>₽</div>
            <div class="total-step">Шаг тарифа 500₽</div>
        </div>

        <div class="bonus-box" id="bonusBox">
            <div class="bonus-header">
                <span id="bonusTitle">Выберите данные</span>
                <span id="bonusPercent">0%</span>
            </div>
            <div class="bonus-text" id="bonusText">
                Начните выбирать категории, чтобы увидеть расчет стоимости и бонусов.
            </div>
            <div class="bucket-container">
                <div class="bucket-progress">
                    <div class="bucket-fill" id="bucketFill"></div>
                </div>
            </div>
        </div>
        
        <div class="stats-grid">
            <div class="stat-item">
                <span class="stat-num" id="selLines" style="color:var(--c-lines-text)">0</span>
                <span class="stat-lbl">Строк</span>
            </div>
            <div class="stat-item">
                <span class="stat-num" id="selPhones" style="color:var(--c-phones-text)">0</span>
                <span class="stat-lbl">Тел</span>
            </div>
            <div class="stat-item">
                <span class="stat-num" id="selEmails" style="color:var(--c-emails-text)">0</span>
                <span class="stat-lbl">Email</span>
            </div>
        </div>

        <div class="tier-section">
            <div class="tier-title">Ваша скидка (от объема)</div>
            <div class="tier-list" id="tierListContainer"></div>
        </div>

        <div class="actions">
            <div class="download-hint">Скачайте файл и просто скиньте мне в чат для заказа 👇</div>
            
            <button class="btn btn-download" onclick="downloadOrder()">⬇ Скачать заказ</button>
            <button class="btn btn-reset" onclick="resetAll()">Сброс</button>
        </div>
    </div>
</div>

<div class="main">
    <div class="toolbar">
        <input type="text" id="searchInput" class="search-input" placeholder="🔍 Поиск...">
    </div>
    
    <div class="tree-wrapper">
        <div class="table-header">
            <div class="header-pad">Категория</div>
            <div class="col-fixed">Строк</div>
            <div class="col-fixed" style="color:var(--c-phones-text)">Тел</div>
            <div class="col-fixed" style="color:var(--c-emails-text)">Email</div>
        </div>
        <div id="treeContainer"></div>
    </div>
</div>

<div class="loader" id="loader">
    <div class="spinner"></div>
    <h3 style="margin-top:20px; color:#475569;">Обработка базы...</h3>
    <div id="errorText" class="error-box"></div>
</div>

<script>
    const TIERS = [
        { limit: 1000,   rate: 0.10,  name: "Новичок" },
        { limit: 5000,   rate: 0.075, name: "Старт" },
        { limit: 10000,  rate: 0.06,  name: "Активный" },
        { limit: 50000,  rate: 0.04,  name: "Бизнес" },
        { limit: 100000, rate: 0.03,  name: "Профи" },
        { limit: 300000, rate: 0.02,  name: "Корпоративный" },
        { limit: Infinity, rate: 0.005, name: "Опт" }
    ];
    
    const PRICE_STEP = 500;
    const DATA_FILE = 'Moscow.txt';

    let treeData = [];
    let selectedIds = new Set();
    let indeterminateIds = new Set(); 
    let debounceTimer;

    window.onload = async () => {
        document.getElementById('searchInput').addEventListener('input', debounceSearch);
        try {
            const resp = await fetch(DATA_FILE);
            if (!resp.ok) throw new Error('File error');
            const text = await resp.text();
            let rawNodes = parseHierarchy(text);
            
            if (rawNodes.length === 1) {
                treeData = rawNodes;
                treeData[0].name = "ВСЕ БАЗЫ"; treeData[0].isRoot = true; treeData[0].expanded = true;
            } else if (rawNodes.length > 1) {
                const totalStats = rawNodes.reduce((acc, node) => {
                    acc.l += node.stats.l; acc.p += node.stats.p; acc.e += node.stats.e;
                    return acc;
                }, { l:0, p:0, e:0 });
                const rootNode = { id: 'ROOT_WRAPPER', name: 'ВСЕ БАЗЫ', stats: totalStats, children: rawNodes, expanded: true, visible: true, isRoot: true, parent: null };
                
                // Присваиваем родителя для первого уровня
                rawNodes.forEach(child => child.parent = rootNode);
                treeData = [rootNode];
            } else { treeData = []; }

            renderTree(treeData, document.getElementById('treeContainer'), 0);
            document.getElementById('loader').style.display = 'none';
            recalculate();
        } catch (e) {
            document.querySelector('.spinner').style.display = 'none';
            document.getElementById('errorText').style.display = 'block';
            document.getElementById('errorText').innerHTML = `Ошибка: файл <b>${DATA_FILE}</b> не найден.`;
        }
    };

    function parseHierarchy(text) {
        const lines = text.split('\n');
        const root = [];
        const stack = [{ level: -1, children: root, node: null }]; 
        let idCounter = 0;
        const regex = /\[(?:Строк:\s*(\d+)\s*\|\s*Тел:\s*(\d+)\s*\|\s*Email:\s*(\d+)|0)\]\s*$/;

        lines.forEach(line => {
            const cleanLine = line.trim();
            if (!cleanLine || cleanLine.startsWith('=') || cleanLine.startsWith('Всего')) return;
            const level = line.search(/\S/);
            if (level === -1) return;
            const match = cleanLine.match(regex);
            let name = cleanLine;
            let stats = { l:0, p:0, e:0 };
            if (match) {
                name = cleanLine.substring(0, match.index).trim();
                if (match[1]) {
                    stats.l = parseInt(match[1])||0; stats.p = parseInt(match[2])||0; stats.e = parseInt(match[3])||0;
                }
            }
            const node = { id: idCounter++, name, stats, children: [], expanded: false, visible: true, parent: null };

            while (stack.length > 1 && stack[stack.length-1].level >= level) stack.pop();
            
            const parent = stack[stack.length-1].node;
            if (parent) {
                node.parent = parent;
            }
            
            stack[stack.length-1].children.push(node);
            stack.push({ level, children: node.children, node: node });
        });
        return root;
    }

    // --- ЛОГИКА ВЫДЕЛЕНИЯ ---
    function toggleNodeSelection(node, isSelected) {
        function setAllChildren(n, state) {
            if (state) {
                selectedIds.add(n.id);
                indeterminateIds.delete(n.id);
            } else {
                selectedIds.delete(n.id);
                indeterminateIds.delete(n.id);
            }
            if (n.children) {
                n.children.forEach(c => setAllChildren(c, state));
            }
        }
        setAllChildren(node, isSelected);

        let current = node.parent;
        while (current) {
            updateParentState(current);
            current = current.parent;
        }
    }

    function updateParentState(node) {
        if (!node.children || node.children.length === 0) return;
        let allSelected = true;
        let noneSelected = true;
        for (let child of node.children) {
            const childSelected = selectedIds.has(child.id);
            const childIndeterminate = indeterminateIds.has(child.id);
            if (!childSelected) allSelected = false;
            if (childSelected || childIndeterminate) noneSelected = false;
        }
        if (allSelected) {
            selectedIds.add(node.id);
            indeterminateIds.delete(node.id);
        } else if (noneSelected) {
            selectedIds.delete(node.id);
            indeterminateIds.delete(node.id);
        } else {
            selectedIds.delete(node.id);
            indeterminateIds.add(node.id);
        }
    }

    function renderTree(nodes, container, depth) {
        const ul = document.createElement('ul');
        ul.className = (container.id === 'treeContainer') ? 'root' : 'nested';

        nodes.forEach(node => {
            if (!node.visible) return;
            const li = document.createElement('li');
            const hasChildren = node.children.length > 0;
            const isSelected = selectedIds.has(node.id);
            const isIndeterminate = indeterminateIds.has(node.id);

            const row = document.createElement('div');
            row.className = `node-row ${isSelected ? 'selected' : ''} ${isIndeterminate ? 'indeterminate' : ''} ${node.isRoot ? 'is-root-node' : ''}`;
            
            const leftDiv = document.createElement('div');
            leftDiv.className = 'row-left';
            leftDiv.style.paddingLeft = (depth * 20) + 'px'; 

            const toggler = document.createElement('div');
            toggler.className = `toggler ${hasChildren ? '' : 'empty'}`;
            toggler.innerHTML = node.expanded ? '▼' : '▶';
            
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.checked = isSelected;
            checkbox.indeterminate = isIndeterminate;

            const nameDiv = document.createElement('div');
            nameDiv.className = 'node-name';
            nameDiv.innerText = node.name;
            
            leftDiv.append(toggler, checkbox, nameDiv);

            const rightDiv = document.createElement('div');
            rightDiv.className = 'row-right';
            const createBadge = (type, val) => {
                const cell = document.createElement('div');
                cell.className = 'col-fixed';
                cell.innerHTML = val > 0 ? `<div class="badge b-${type}">${val.toLocaleString()}</div>` : `<span style="opacity:0.3; font-size:0.8rem">—</span>`;
                return cell;
            }
            rightDiv.append(createBadge('lines', node.stats.l), createBadge('phones', node.stats.p), createBadge('emails', node.stats.e));
            row.append(leftDiv, rightDiv);
            li.appendChild(row);
            
            const toggleExpand = (e) => {
                e.stopPropagation(); if (!hasChildren) return;
                node.expanded = !node.expanded; toggler.innerHTML = node.expanded ? '▼' : '▶';
                let childUl = li.querySelector('ul.nested');
                if (!childUl) { renderTree(node.children, li, depth + 1); childUl = li.querySelector('ul.nested'); }
                if (node.expanded) childUl.style.display = 'block'; else childUl.style.display = 'none';
            };
            
            const handleCheck = (e) => {
                e.stopPropagation();
                const newState = !isSelected;
                toggleNodeSelection(node, newState);
                document.getElementById('treeContainer').innerHTML = '';
                renderTree(treeData, document.getElementById('treeContainer'), 0);
                recalculate();
            };

            toggler.onclick = toggleExpand;
            row.onclick = (e) => { if(e.target !== checkbox && !e.target.closest('.toggler')) handleCheck(e); }; 
            checkbox.onclick = handleCheck; 

            if (node.expanded && hasChildren) {
                renderTree(node.children, li, depth + 1);
                li.querySelector('ul.nested').style.display = 'block';
            }
            ul.appendChild(li);
        });
        container.appendChild(ul);
    }

    function recalculate() {
        let l=0, p=0, e=0;
        
        function traverseCalc(nodes) {
            nodes.forEach(n => {
                if (selectedIds.has(n.id)) {
                    l += n.stats.l; p += n.stats.p; e += n.stats.e;
                } 
                else if (indeterminateIds.has(n.id) || (n.children && n.children.length > 0)) {
                    if (n.children.length) traverseCalc(n.children);
                }
            });
        }
        traverseCalc(treeData);

        const volume = l + p + e;

        let currentTier = TIERS[0];
        let tierIndex = 0;
        for (let i = 0; i < TIERS.length; i++) {
            if (volume < TIERS[i].limit) {
                currentTier = TIERS[i]; tierIndex = i; break;
            }
        }
        if (volume >= TIERS[TIERS.length-1].limit) {
             currentTier = TIERS[TIERS.length-1]; tierIndex = TIERS.length - 1;
        }

        const rawPrice = volume * currentTier.rate;
        let finalPrice = Math.ceil(rawPrice / PRICE_STEP) * PRICE_STEP;
        if (finalPrice === 0 && volume > 0) finalPrice = PRICE_STEP;

        // UI
        document.getElementById('selLines').innerText = l.toLocaleString();
        document.getElementById('selPhones').innerText = p.toLocaleString();
        document.getElementById('selEmails').innerText = e.toLocaleString();
        document.getElementById('totalPrice').innerText = finalPrice.toLocaleString();

        // BONUS LOGIC
        const bonusBox = document.getElementById('bonusBox');
        const bucketFill = document.getElementById('bucketFill');
        const bonusTitle = document.getElementById('bonusTitle');
        const bonusText = document.getElementById('bonusText');
        const bonusPercent = document.getElementById('bonusPercent');

        if (volume === 0) {
            bonusBox.className = 'bonus-box';
            bonusTitle.innerText = "Выберите данные";
            bonusText.innerHTML = "Отмечайте галочками регионы, чтобы увидеть расчет стоимости.";
            bucketFill.style.width = '0%';
            bonusPercent.innerText = "0%";
        } else {
            bonusBox.className = 'bonus-box active';
            const maxVolume = Math.floor(finalPrice / currentTier.rate);
            const freeVolume = maxVolume - volume;
            const percentUsed = Math.round((volume / maxVolume) * 100);
            
            bonusTitle.innerText = "Пакет активен!";
            bonusPercent.innerText = percentUsed + "%";
            bucketFill.style.width = percentUsed + '%';

            if (freeVolume > 0) {
                bonusText.innerHTML = `В пакет ${finalPrice}₽ поместится еще <span class="bonus-highlight">${freeVolume.toLocaleString()}</span> записей бесплатно!`;
            } else {
                bonusText.innerHTML = `Пакет на ${finalPrice}₽ заполнен идеально (100%). Следующая запись добавит +500₽ к чеку.`;
            }
        }

        renderTierList(tierIndex, volume);
    }

    function renderTierList(currentIndex, volume) {
        const container = document.getElementById('tierListContainer');
        container.innerHTML = '';
        const baseRate = TIERS[0].rate; 

        TIERS.forEach((tier, index) => {
            const el = document.createElement('div');
            const saving = Math.round(((baseRate - tier.rate) / baseRate) * 100);
            
            let statusClass = '';
            let label = `<span class="save-badge">-${saving}%</span>`;
            if (saving === 0) label = '';

            if (index === currentIndex) {
                statusClass = 'current';
                const nextTier = TIERS[index + 1];
                let pct = 0;
                if (nextTier) {
                    const prevLimit = index > 0 ? TIERS[index-1].limit : 0;
                    const range = nextTier.limit - prevLimit;
                    const val = volume - prevLimit;
                    pct = (val / range) * 100;
                    if (pct > 100) pct = 100;
                    el.style.setProperty('--progress', pct + '%');
                } else {
                    el.style.setProperty('--progress', '100%');
                }
            } else if (index < currentIndex) {
                statusClass = 'passed';
            } else {
                statusClass = 'locked';
            }

            el.className = `tier-item ${statusClass}`;
            
            el.innerHTML = `
                <div>${tier.name} ${label}</div>
                <div class="tier-rate">${tier.rate}₽</div>
            `;
            container.appendChild(el);
        });
    }

    // --- ПОЛУЧЕНИЕ ПУТИ (ДЛЯ ФАЙЛА) ---
    function getNodePath(node) {
        let path = [];
        let curr = node;
        // Поднимаемся вверх, пока не дойдем до null или до Корневой Обертки
        while (curr && !curr.isRoot) {
            path.unshift(curr.name);
            curr = curr.parent;
        }
        return path.join(" / ");
    }

    function resetAll() {
        selectedIds.clear();
        indeterminateIds.clear();
        document.getElementById('treeContainer').innerHTML = '';
        renderTree(treeData, document.getElementById('treeContainer'), 0);
        recalculate();
    }
    
    function debounceSearch() { clearTimeout(debounceTimer); debounceTimer = setTimeout(runSearch, 300); }
    function runSearch() {
        const q = document.getElementById('searchInput').value.toLowerCase();
        const filter = (node) => {
            const match = node.name.toLowerCase().includes(q);
            let childMatch = false;
            if (node.children.length) node.children.forEach(c => { if (filter(c)) childMatch = true; });
            node.visible = match || childMatch;
            if (q && childMatch) node.expanded = true; else if (!q) node.expanded = !!node.isRoot;
            return node.visible;
        };
        treeData.forEach(filter);
        document.getElementById('treeContainer').innerHTML = '';
        renderTree(treeData, document.getElementById('treeContainer'), 0);
    }

    // --- ОБНОВЛЕННАЯ ФУНКЦИЯ СКАЧИВАНИЯ ---
    function downloadOrder() {
        if (selectedIds.size === 0 && indeterminateIds.size === 0) { alert('Ничего не выбрано!'); return; }
        const price = document.getElementById('totalPrice').innerText;
        let text = `ЗАКАЗ\nДата: ${new Date().toLocaleString()}\n`;
        text += `К оплате: ${price} руб.\n`;
        text += `Объем: Строк:${document.getElementById('selLines').innerText} | Телефонов:${document.getElementById('selPhones').innerText} | Email:${document.getElementById('selEmails').innerText}\n`;
        text += `--------------------------------\n`;
        
        const traverseWrite = (nodes) => {
            nodes.forEach(n => {
                // Если выбран полностью - пишем его путь
                if (selectedIds.has(n.id)) {
                    const fullPath = getNodePath(n);
                    text += `[+] ${fullPath} (Строк: ${n.stats.l} | Телефонов: ${n.stats.p} | Email: ${n.stats.e})\n`;
                } 
                // Если частично (или просто папка раскрыта), идем внутрь
                else if (n.children.length) {
                    traverseWrite(n.children);
                }
            });
        };
        traverseWrite(treeData);
        
        const link = document.createElement('a');
        link.href = URL.createObjectURL(new Blob([text], {type: 'text/plain'}));
        link.download = `Order_${price}RUB.txt`;
        link.click();
    }
</script>
