<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор Базы</title>
    <style>
        :root {
            --bg-body: #f8fafc;       
            --bg-sidebar: #ffffff;    
            --text-main: #0f172a;     
            --text-muted: #64748b;    
            --border: #e2e8f0;        
            
            /* Цвета столбцов (для цифр) */
            --col-lines: #334155; 
            --col-phones: #2563eb; 
            --col-emails: #16a34a; 
            
            --primary: #2563eb;
        }

        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; 
            background: var(--bg-body); 
            color: var(--text-main); 
            margin: 0; display: flex; height: 100vh; overflow: hidden; 
        }
        
        /* --- SIDEBAR --- */
        .sidebar { 
            width: 340px; background: var(--bg-sidebar); border-right: 1px solid var(--border); 
            display: flex; flex-direction: column; z-index: 20; 
            box-shadow: 4px 0 24px rgba(0,0,0,0.02);
        }
        .sidebar-header { padding: 20px 24px; border-bottom: 1px solid var(--border); }
        .sidebar-header h2 { margin: 0; font-size: 1.3rem; font-weight: 800; letter-spacing: -0.5px; }

        .sidebar-content { padding: 24px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 24px;}

        /* INPUTS */
        .price-section { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
        .price-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 0.9rem; font-weight: 500;}
        .price-row:last-child { margin-bottom: 0; }
        .price-input { 
            width: 70px; padding: 6px 10px; border: 1px solid #cbd5e1; border-radius: 6px; 
            text-align: right; font-weight: 700; background: #fff; color: var(--text-main);
        }
        
        /* TOTAL BOX */
        .total-box {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: white; padding: 30px 20px; border-radius: 16px; text-align: center;
            box-shadow: 0 10px 20px -5px rgba(37, 99, 235, 0.3);
        }
        .total-value { font-size: 2.5rem; font-weight: 800; line-height: 1; letter-spacing: -1px; margin-top: 5px;}
        .total-label { font-size: 0.85rem; font-weight: 500; opacity: 0.9; text-transform: uppercase; letter-spacing: 0.5px; }

        /* BUTTONS */
        .actions { margin-top: auto; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; margin-bottom: 8px; transition: 0.2s;}
        .btn-download { background: #0f172a; color: white; }
        .btn-download:hover { background: #1e293b; }
        .btn-reset { background: transparent; color: #ef4444; border: 1px solid #fecaca; }
        .btn-reset:hover { background: #fef2f2; }

        /* --- MAIN AREA --- */
        .main { flex: 1; display: flex; flex-direction: column; background: #fff; }
        
        .toolbar { padding: 16px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; }
        .search-input { 
            width: 100%; max-width: 400px; padding: 10px 16px; font-size: 0.95rem; 
            border: 1px solid #cbd5e1; border-radius: 8px; background: #f8fafc;
        }
        .search-input:focus { background: #fff; outline: 2px solid var(--primary); border-color: transparent; }

        /* --- TABLE HEADER (Sticky) --- */
        .table-header {
            display: flex;
            padding: 12px 0;
            background: #f1f5f9;
            border-bottom: 1px solid #cbd5e1;
            font-size: 0.75rem;
            font-weight: 700;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            position: sticky; /* Закрепление */
            top: 0;
            z-index: 10;
        }
        .col-name { flex: 1; padding-left: 24px; } /* Отступ слева */
        .col-stat { width: 100px; text-align: center; } /* Фикс ширина колонок */

        /* --- TREE LIST --- */
        .tree-wrapper { flex: 1; overflow-y: auto; }
        ul { list-style: none; padding: 0; margin: 0; }
        
        /* Node Row: Flex Container */
        .node-row { 
            display: flex; 
            align-items: center; 
            padding: 8px 0; /* Vertical padding only */
            border-bottom: 1px solid #f1f5f9;
            cursor: pointer; 
            transition: background 0.1s;
        }
        .node-row:hover { background: #f8fafc; }
        .node-row.selected { background: #eff6ff; }
        
        /* Left side (Indentation + Name) */
        .node-left { 
            flex: 1; 
            display: flex; 
            align-items: center; 
            padding-right: 10px;
            overflow: hidden; /* Prevent text overflow */
        }
        
        /* Right side (Numbers) */
        .node-stats { display: flex; }
        .stat-cell { 
            width: 100px; /* Must match header col-stat */
            text-align: center; 
            font-size: 0.95rem; /* Larger font */
            font-weight: 700;   /* Bolder */
        }
        
        /* Column Colors */
        .c-lines { color: var(--col-lines); }
        .c-phones { color: var(--col-phones); }
        .c-emails { color: var(--col-emails); }

        /* Controls */
        .toggler { 
            width: 24px; height: 24px; 
            display: flex; align-items: center; justify-content: center; 
            margin-right: 4px; color: #94a3b8; font-size: 0.7rem; flex-shrink: 0;
        }
        .toggler:hover { color: var(--text-main); background: #e2e8f0; border-radius: 4px; }
        .toggler.empty { opacity: 0; pointer-events: none; }

        input[type="checkbox"] { 
            width: 16px; height: 16px; margin-right: 10px; cursor: pointer; accent-color: var(--primary); flex-shrink: 0;
        }

        .node-name { 
            font-weight: 500; font-size: 0.95rem; color: var(--text-main);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        /* ROOT SPECIAL STYLE */
        .node-row.is-root-node { background: #f1f5f9; border-bottom: 2px solid #cbd5e1; }
        .node-row.is-root-node .node-name { font-weight: 800; font-size: 1rem; }
        .node-row.is-root-node.selected { background: #dbeafe; }

        ul.nested { display: none; }
        ul.nested.active { display: block; }
        
        /* Loader */
        .loader { position: fixed; inset: 0; background: rgba(255,255,255,0.95); z-index: 999; display: flex; justify-content: center; align-items: center; flex-direction: column; }
        .spinner { width: 40px; height: 40px; border: 4px solid #e2e8f0; border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error-box { display: none; color: #dc2626; background: #fee2e2; padding: 20px; border-radius: 8px; }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="sidebar-header">
        <h2>📊 Moscow Base</h2>
    </div>
    <div class="sidebar-content">
        <div class="total-box">
            <div class="total-label">Итоговая стоимость</div>
            <div class="total-value"><span id="totalPrice">0</span>₽</div>
        </div>
        
        <div class="price-section">
            <div class="price-row"><label>Строка</label><input type="number" class="price-input" id="pLine" value="0.5" step="0.1"></div>
            <div class="price-row"><label style="color:var(--col-phones)">Телефон</label><input type="number" class="price-input" id="pPhone" value="2" step="0.1"></div>
            <div class="price-row"><label style="color:var(--col-emails)">Email</label><input type="number" class="price-input" id="pEmail" value="5" step="0.1"></div>
        </div>

        <div class="actions">
            <button class="btn btn-download" onclick="downloadOrder()">Скачать заказ (.txt)</button>
            <button class="btn btn-reset" onclick="resetAll()">Сбросить всё</button>
        </div>
    </div>
</div>

<div class="main">
    <div class="toolbar">
        <input type="text" id="searchInput" class="search-input" placeholder="🔍 Быстрый поиск...">
    </div>
    
    <div class="table-header">
        <div class="col-name">Категория</div>
        <div class="col-stat">Строк</div>
        <div class="col-stat" style="color:var(--col-phones)">Телефонов</div>
        <div class="col-stat" style="color:var(--col-emails)">Email</div>
    </div>

    <div class="tree-wrapper" id="treeContainer"></div>
</div>

<div class="loader" id="loader">
    <div class="spinner"></div>
    <h3 style="margin-top:20px; color:#475569;">Обработка базы...</h3>
    <div id="errorText" class="error-box"></div>
</div>

<script>
    const DATA_FILE = 'Moscow.txt';
    let treeData = [];
    let selectedIds = new Set();
    let debounceTimer;

    window.onload = async () => {
        ['pLine', 'pPhone', 'pEmail'].forEach(id => document.getElementById(id).addEventListener('input', recalculate));
        document.getElementById('searchInput').addEventListener('input', debounceSearch);

        try {
            const resp = await fetch(DATA_FILE);
            if (!resp.ok) throw new Error('File error');
            const text = await resp.text();
            
            let rawNodes = parseHierarchy(text);
            
            // Логика корня "ВСЕ БАЗЫ"
            if (rawNodes.length === 1) {
                treeData = rawNodes;
                treeData[0].name = "ВСЕ БАЗЫ"; // Новое название
                treeData[0].isRoot = true;    
                treeData[0].expanded = true;
            } else if (rawNodes.length > 1) {
                const totalStats = rawNodes.reduce((acc, node) => {
                    acc.l += node.stats.l;
                    acc.p += node.stats.p;
                    acc.e += node.stats.e;
                    return acc;
                }, { l:0, p:0, e:0 });

                const rootNode = {
                    id: 'ROOT_WRAPPER', 
                    name: 'ВСЕ БАЗЫ', // Новое название
                    stats: totalStats,
                    children: rawNodes,
                    expanded: true,
                    visible: true,
                    isRoot: true
                };
                treeData = [rootNode];
            } else {
                 treeData = [];
            }

            renderTree(treeData, document.getElementById('treeContainer'), 0); // Start depth 0
            document.getElementById('loader').style.display = 'none';
        } catch (e) {
            document.querySelector('.spinner').style.display = 'none';
            const err = document.getElementById('errorText');
            err.style.display = 'block';
            err.innerHTML = `Ошибка: файл <b>${DATA_FILE}</b> не найден.`;
        }
    };

    function parseHierarchy(text) {
        const lines = text.split('\n');
        const root = [];
        const stack = [{ level: -1, children: root }];
        let idCounter = 0;
        const regex = /\[(?:Строк:\s*(\d+)\s*\|\s*Тел:\s*(\d+)\s*\|\s*Email:\s*(\d+)|0)\]\s*$/;

        lines.forEach(line => {
            const cleanLine = line.trim();
            if (!cleanLine || cleanLine.startsWith('=') || cleanLine.startsWith('Всего')) return;

            const level = line.search(/\S/);
            if (level === -1) return;

            const match = cleanLine.match(regex);
            let name = cleanLine;
            let stats = { l:0, p:0, e:0 };

            if (match) {
                name = cleanLine.substring(0, match.index).trim();
                if (match[1]) {
                    stats.l = parseInt(match[1])||0;
                    stats.p = parseInt(match[2])||0;
                    stats.e = parseInt(match[3])||0;
                }
            }
            
            const node = { id: idCounter++, name, stats, children: [], expanded: false, visible: true };

            while (stack.length > 1 && stack[stack.length-1].level >= level) stack.pop();
            stack[stack.length-1].children.push(node);
            stack.push({ level, children: node.children });
        });
        return root;
    }

    // Добавили аргумент depth для отступов
    function renderTree(nodes, container, depth) {
        const ul = document.createElement('ul');
        ul.className = (container.id === 'treeContainer') ? 'root' : 'nested';
        if (depth > 0) ul.classList.add('active'); // Вложенные списки сразу активны в структуре (видимость через JS)

        nodes.forEach(node => {
            if (!node.visible) return;
            const li = document.createElement('li');
            const hasChildren = node.children.length > 0;
            const isSelected = selectedIds.has(node.id);

            // Row Wrapper
            const row = document.createElement('div');
            row.className = `node-row ${isSelected ? 'selected' : ''} ${node.isRoot ? 'is-root-node' : ''}`;
            
            // --- LEFT PART (Name + Indent) ---
            const leftDiv = document.createElement('div');
            leftDiv.className = 'node-left';
            
            // Расчет отступа: Базовый (24px) + Глубина * 20px
            leftDiv.style.paddingLeft = (24 + (depth * 20)) + 'px';

            const toggler = document.createElement('div');
            toggler.className = `toggler ${hasChildren ? '' : 'empty'}`;
            toggler.innerHTML = node.expanded ? '▼' : '▶';
            
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.checked = isSelected;
            
            const nameDiv = document.createElement('div');
            nameDiv.className = 'node-name';
            nameDiv.innerText = node.name;
            
            leftDiv.append(toggler, checkbox, nameDiv);

            // --- RIGHT PART (Stats Columns) ---
            const statsDiv = document.createElement('div');
            statsDiv.className = 'node-stats';
            statsDiv.innerHTML = `
                <div class="stat-cell c-lines">${node.stats.l > 0 ? node.stats.l.toLocaleString() : '-'}</div>
                <div class="stat-cell c-phones">${node.stats.p > 0 ? node.stats.p.toLocaleString() : '-'}</div>
                <div class="stat-cell c-emails">${node.stats.e > 0 ? node.stats.e.toLocaleString() : '-'}</div>
            `;

            row.append(leftDiv, statsDiv);
            li.appendChild(row);

            // Logic
            const toggleExpand = (e) => {
                e.stopPropagation();
                if (!hasChildren) return;
                node.expanded = !node.expanded;
                toggler.innerHTML = node.expanded ? '▼' : '▶';
                
                let childUl = li.querySelector('ul.nested');
                if (!childUl) { 
                    renderTree(node.children, li, depth + 1); // Pass depth + 1
                    childUl = li.querySelector('ul.nested'); 
                }
                
                if (node.expanded) {
                    childUl.classList.add('active');
                    childUl.style.display = 'block';
                } else {
                    childUl.classList.remove('active');
                    childUl.style.display = 'none';
                }
            };

            const toggleCheck = (e) => {
                e.stopPropagation();
                const checked = e.target.checked;
                const setRecursive = (n, s) => {
                    s ? selectedIds.add(n.id) : selectedIds.delete(n.id);
                    if (n.children) n.children.forEach(c => setRecursive(c, s));
                };
                setRecursive(node, checked);
                
                // Полная перерисовка нужна для обновления чекбоксов
                document.getElementById('treeContainer').innerHTML = '';
                renderTree(treeData, document.getElementById('treeContainer'), 0);
                recalculate();
            };

            toggler.onclick = toggleExpand;
            row.onclick = (e) => { if(e.target !== checkbox) toggleExpand(e); }; // Click row to expand
            checkbox.onclick = toggleCheck; 

            if (node.expanded && hasChildren) {
                renderTree(node.children, li, depth + 1);
                const u = li.querySelector('ul.nested');
                u.style.display = 'block';
                u.classList.add('active');
            }
            ul.appendChild(li);
        });
        container.appendChild(ul);
    }

    function recalculate() {
        let l=0, p=0, e=0;
        function traverse(nodes) {
            nodes.forEach(n => {
                if (selectedIds.has(n.id)) {
                    l += n.stats.l;
                    p += n.stats.p;
                    e += n.stats.e;
                } else {
                    if (n.children.length) traverse(n.children);
                }
            });
        }
        traverse(treeData);

        const pl = parseFloat(document.getElementById('pLine').value) || 0;
        const pp = parseFloat(document.getElementById('pPhone').value) || 0;
        const pe = parseFloat(document.getElementById('pEmail').value) || 0;
        const total = (l * pl) + (p * pp) + (e * pe);
        document.getElementById('totalPrice').innerText = Math.round(total).toLocaleString();
    }

    function resetAll() {
        selectedIds.clear();
        document.getElementById('treeContainer').innerHTML = '';
        renderTree(treeData, document.getElementById('treeContainer'), 0);
        recalculate();
    }

    function debounceSearch() { clearTimeout(debounceTimer); debounceTimer = setTimeout(runSearch, 300); }

    function runSearch() {
        const q = document.getElementById('searchInput').value.toLowerCase();
        const filter = (node) => {
            const match = node.name.toLowerCase().includes(q);
            let childMatch = false;
            if (node.children.length) node.children.forEach(c => { if (filter(c)) childMatch = true; });
            node.visible = match || childMatch;
            if (q && childMatch) node.expanded = true;
            else if (!q) node.expanded = !!node.isRoot; 
            return node.visible;
        };
        treeData.forEach(filter);
        document.getElementById('treeContainer').innerHTML = '';
        renderTree(treeData, document.getElementById('treeContainer'), 0);
    }

    function downloadOrder() {
        if (selectedIds.size === 0) { alert('Ничего не выбрано!'); return; }
        let text = `ЗАКАЗ\nДата: ${new Date().toLocaleString()}\n`;
        text += `Сумма: ${document.getElementById('totalPrice').innerText} руб.\n---\n`;
        const traverseWrite = (nodes) => {
            nodes.forEach(n => {
                if (selectedIds.has(n.id)) text += `[+] ${n.name} (L:${n.stats.l} P:${n.stats.p} E:${n.stats.e})\n`;
                else if (n.children.length) traverseWrite(n.children);
            });
        };
        traverseWrite(treeData);
        const link = document.createElement('a');
        link.href = URL.createObjectURL(new Blob([text], {type: 'text/plain'}));
        link.download = 'Order.txt';
        link.click();
    }
</script>

</body>
</html>
