<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Base Calculator: Bi-Directional</title>
    <script src="database.js"></script>
    <style>
        :root {
            --bg-body: #f1f5f9; --bg-sidebar: #ffffff; --text-main: #0f172a; --text-muted: #64748b; --border: #e2e8f0;
            --primary: #3b82f6; --success: #22c55e; --success-bg: #ecfdf5; --success-border: #6ee7b7;
            --c-lines-text: #475569; --c-phones-text: #1d4ed8; --c-emails-text: #15803d;
        }

        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg-body); color: var(--text-main); margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* SIDEBAR */
        .sidebar { width: 400px; background: var(--bg-sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; z-index: 30; box-shadow: 4px 0 24px rgba(0,0,0,0.05); }
        .sidebar-content { padding: 20px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 15px;}

        .total-box { background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%); color: white; padding: 20px; border-radius: 16px; text-align: center; box-shadow: 0 10px 20px -5px rgba(37, 99, 235, 0.4); flex-shrink: 0; }
        .total-value { font-size: 2.8rem; font-weight: 800; line-height: 1; letter-spacing: -1px;}
        .total-step { font-size: 0.8rem; opacity: 0.7; margin-top: 5px; background: rgba(0,0,0,0.2); display: inline-block; padding: 2px 8px; border-radius: 4px;}

        .bonus-box { background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 12px; padding: 16px; transition: 0.3s all; flex-shrink: 0; display: flex; flex-direction: column; gap: 10px; }
        .bonus-box.active { background: var(--success-bg); border-color: var(--success-border); box-shadow: 0 4px 12px -2px rgba(16, 185, 129, 0.2); }
        .bonus-header { display: flex; justify-content: space-between; align-items: center; color: var(--text-muted); font-weight: 700; font-size: 0.9rem; }
        .bonus-box.active .bonus-header { color: #047857; }
        .bonus-text { font-size: 0.85rem; color: var(--text-muted); line-height: 1.4; }
        .bonus-box.active .bonus-text { color: #065f46; }
        .bucket-container { width: 100%; display: flex; flex-direction: column; gap: 4px; background: rgba(0,0,0,0.05); border-radius: 4px; overflow: hidden;}
        .bucket-progress { height: 10px; width: 100%; position: relative; }
        .bucket-fill { height: 100%; background: #94a3b8; width: 0%; transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
        .bonus-box.active .bucket-fill { background: #10b981; }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; text-align: center; flex-shrink: 0;}
        .stat-item { background: white; padding: 10px 5px; border-radius: 10px; border: 1px solid var(--border); }
        .stat-num { display: block; font-weight: 800; font-size: 1rem; color: var(--text-main); margin-bottom: 2px; }
        .stat-lbl { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }

        .tier-section { border-top: 1px solid var(--border); padding-top: 15px; }
        .tier-list { display: flex; flex-direction: column; gap: 8px; }
        .tier-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; border-radius: 8px; background: white; border: 1px solid transparent; transition: 0.2s; font-size: 0.85rem; color: var(--text-muted); }
        .tier-item.passed { background: #f1f5f9; color: #94a3b8; text-decoration: line-through; }
        .tier-item.current { background: #eff6ff; border: 1px solid #bfdbfe; color: #1e3a8a; font-weight: 600; box-shadow: 0 2px 4px rgba(59, 130, 246, 0.1); position: relative; overflow: hidden; }

        .actions { margin-top: auto; padding-top: 10px; }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; margin-bottom: 10px; transition: 0.2s; font-size: 0.95rem; }
        .btn-download { background: #0f172a; color: white; }
        .btn-reset { background: white; color: #ef4444; border: 1px solid #fecaca; }

        /* MAIN */
        .main { flex: 1; display: flex; flex-direction: column; background: white; }
        .toolbar { padding: 15px 30px; border-bottom: 1px solid var(--border); background: #f8fafc; display: flex; flex-direction: column; gap: 15px; }
        .search-input { width: 100%; padding: 10px 15px; font-size: 1rem; border: 1px solid #cbd5e1; border-radius: 8px; background: white; }
        
        /* FILTERS */
        .geo-grid { display: flex; flex-wrap: wrap; gap: 10px; width: 100%; }
        
        .custom-select-container { position: relative; flex: 1; min-width: 180px; }
        .custom-select-container.is-open { z-index: 101; }

        .select-trigger {
            padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 6px; 
            font-size: 0.9rem; background: white; width: 100%; cursor: pointer;
            text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            display: flex; justify-content: space-between; align-items: center;
            user-select: none; box-sizing: border-box;
        }
        .select-trigger::after { content: '▼'; font-size: 0.7rem; color: #94a3b8; margin-left: 8px;}
        .select-trigger.disabled { background: #f1f5f9; color: #94a3b8; pointer-events: none; opacity: 0.8; }

        .select-dropdown {
            position: absolute; top: 100%; left: 0; right: 0; 
            background: white; border: 1px solid #cbd5e1; border-radius: 6px;
            margin-top: 4px; box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            max-height: 350px; overflow-y: auto; display: none; z-index: 999;
        }
        .select-dropdown.show { display: block; }
        
        .select-option { padding: 10px 12px; cursor: pointer; font-size: 0.9rem; color: var(--text-main); border-bottom: 1px solid #f1f5f9; display: flex; align-items: center; }
        .select-option:hover { background: #f8fafc; }
        .select-option.selected { background: #eff6ff; color: var(--primary); font-weight: 600; }
        .select-real-checkbox { width: 18px; height: 18px; margin-right: 10px; cursor: pointer; accent-color: var(--primary); transform: scale(1.1); flex-shrink: 0; }
        .select-all-opt { font-weight: 700; border-bottom: 2px solid #e2e8f0; background: #fafafa; position: sticky; top: 0; z-index: 2; }

        /* SUMMARY PANEL */
        .summary-panel { 
            display: flex; flex-direction: column; gap: 4px; 
            padding-top: 5px; border-top: 1px solid #e2e8f0; 
        }
        .summary-row { font-size: 0.75rem; color: #64748b; line-height: 1.4; display: flex; }
        .summary-label { font-weight: 700; color: #475569; margin-right: 6px; min-width: 60px; }
        .summary-value { color: #334155; word-break: break-word; }

        /* TREE */
        .tree-wrapper { flex: 1; overflow-y: auto; padding: 0 30px 20px 30px; }
        ul { list-style: none; padding: 0; margin: 0; }
        .table-header { position: sticky; top: 0; z-index: 10; background: white; padding-top: 20px; padding-bottom: 10px; border-bottom: 1px solid var(--border); font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; display: flex; }
        .header-pad { padding-left: 50px; flex: 1; } 
        .col-fixed { width: 90px; text-align: center; }

        .node-row { display: flex; align-items: center; padding: 8px 0; border-radius: 6px; cursor: pointer; border-bottom: 1px solid #f1f5f9; }
        .node-row:hover { background: #f8fafc; }
        .node-row.selected { background: #eff6ff; }
        .node-row.indeterminate { background: #fff7ed; } 
        
        .row-left { flex: 1; display: flex; align-items: center; overflow: hidden; padding-right: 15px; }
        .row-right { display: flex; gap: 5px; }
        
        .toggler { width: 24px; display: flex; justify-content: center; margin-right: 8px; color: #94a3b8; flex-shrink: 0; font-size: 0.8rem;}
        .toggler.empty { opacity: 0; pointer-events: none; } 

        .node-checkbox { width: 18px; height: 18px; margin-right: 12px; cursor: pointer; accent-color: var(--primary); flex-shrink: 0; }
        .node-name { font-weight: 500; font-size: 0.95rem; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .badge { padding: 4px 0; border-radius: 6px; font-size: 0.85rem; font-weight: 700; display: flex; justify-content: center; width: 100%; }
        .b-lines { color: var(--c-lines-text); } .b-phones { color: var(--c-phones-text); } .b-emails { color: var(--c-emails-text); }
        
        .loader { position: fixed; inset: 0; background: rgba(255,255,255,0.95); z-index: 999; display: flex; justify-content: center; align-items: center; flex-direction: column; }

        /* ================= TOUR WIDGET STYLES ================= */
        .tour-highlight {
            position: relative !important;
            z-index: 10000 !important;
            box-shadow: 0 0 0 6px white, 0 0 0 9999px rgba(15, 23, 42, 0.75) !important;
            border-radius: 10px;
            pointer-events: none !important;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .tour-bg-fix { background: white !important; }
        .tour-no-clip { overflow: visible !important; }

        .tour-tooltip {
            position: fixed;
            width: 380px; /* Увеличили ширину, чтобы кнопки не слипались */
            background: white;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            z-index: 10001;
            display: none;
            flex-direction: column;
            gap: 12px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .tour-tooltip.visible { display: flex; opacity: 1; }
        .tour-header { font-weight: 800; font-size: 1.15rem; color: var(--text-main); }
        .tour-body { font-size: 0.9rem; color: var(--text-muted); line-height: 1.5; }
        
        .tour-footer { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-top: 15px; /* Увеличили отступ сверху */
            gap: 10px; /* Добавили обязательный промежуток */
        }
        
        .tour-btn { padding: 8px 16px; border: none; border-radius: 8px; cursor: pointer; font-size: 0.85rem; font-weight: 600; transition: 0.2s; white-space: nowrap;}
        
        .tour-btn-skip { background: #fee2e2; color: #ef4444; border: 1px solid #fca5a5; }
        .tour-btn-skip:hover { background: #fecaca; color: #dc2626; border-color: #f87171; }
        
        .tour-btn-next { background: var(--primary); color: white; }
        .tour-btn-next:hover { background: #2563eb; }
        
        .tour-dots { display: flex; gap: 6px; justify-content: center; }
        .tour-dot { width: 8px; height: 8px; border-radius: 50%; background: #cbd5e1; transition: 0.3s; }
        .tour-dot.active { background: var(--primary); transform: scale(1.2); }

        .help-float-btn {
            position: fixed; bottom: 20px; right: 20px; width: 44px; height: 44px;
            border-radius: 50%; background: var(--primary); color: white;
            border: none; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
            font-size: 1.3rem; font-weight: bold; cursor: pointer;
            z-index: 9000; display: flex; justify-content: center; align-items: center;
            transition: 0.2s;
        }
        .help-float-btn:hover { transform: scale(1.1); background: #2563eb; }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="sidebar-content">
        <div class="total-box">
            <div class="total-label">К оплате</div>
            <div class="total-value"><span id="totalPrice">0</span>₽</div>
            <div class="total-step">Мин. заказ 500₽ | Шаг 100₽</div>
        </div>

        <div class="bonus-box" id="bonusBox">
            <div class="bonus-header">
                <span id="bonusTitle">Скидка</span>
                <span id="bonusPercent">0%</span>
            </div>
            <div class="bonus-text" id="bonusText">...</div>
            <div class="bucket-container"><div class="bucket-progress"><div class="bucket-fill" id="bucketFill"></div></div></div>
        </div>
        
        <div class="stats-grid">
            <div class="stat-item"><span class="stat-num" id="selLines" style="color:var(--c-lines-text)">0</span><span class="stat-lbl">Строк</span></div>
            <div class="stat-item"><span class="stat-num" id="selPhones" style="color:var(--c-phones-text)">0</span><span class="stat-lbl">Тел</span></div>
            <div class="stat-item"><span class="stat-num" id="selEmails" style="color:var(--c-emails-text)">0</span><span class="stat-lbl">Email</span></div>
        </div>

        <div class="tier-section">
            <div class="tier-list" id="tierListContainer"></div>
        </div>

        <div class="actions">
            <button class="btn btn-download" onclick="downloadOrder()">⬇ Скачать заказ</button>
            <button class="btn btn-reset" onclick="resetAll()">Сброс</button>
        </div>
    </div>
</div>

<div class="main">
    <div class="toolbar">
        <input type="text" id="searchInput" class="search-input" placeholder="🔍 Поиск...">
        <div class="geo-grid" id="geoFilters"></div>
        <div class="summary-panel" id="summaryPanel"></div>
    </div>
    
    <div class="tree-wrapper">
        <div class="table-header">
            <div class="header-pad">Категория</div>
            <div class="col-fixed">Строк</div>
            <div class="col-fixed" style="color:var(--c-phones-text)">Тел</div>
            <div class="col-fixed" style="color:var(--c-emails-text)">Email</div>
        </div>
        <div id="treeContainer"></div>
    </div>
</div>

<div class="loader" id="loader">
    <h3 style="color:#475569;">Загрузка...</h3>
    <div id="loaderStatus" style="color:#94a3b8; font-size:0.8rem"></div>
</div>

<button class="help-float-btn" onclick="startTour(true)" title="Показать обучение">?</button>
<div class="tour-tooltip" id="tourTooltip">
    <div class="tour-header" id="tourTitle">Заголовок</div>
    <div class="tour-body" id="tourText">Текст</div>
    <div class="tour-footer">
        <button class="tour-btn tour-btn-skip" onclick="endTour()">Пропустить тур</button>
        <div class="tour-dots" id="tourDots"></div>
        <button class="tour-btn tour-btn-next" id="tourNextBtn" onclick="nextTourStep()">Далее</button>
    </div>
</div>

<script>
    const TIERS = [
        { limit: 20000, rate: 0.015, name: "Новичок" },         
        { limit: 50000, rate: 0.01, name: "Старт" },           
        { limit: 100000, rate: 0.0075, name: "Активный" },      
        { limit: 250000, rate: 0.005, name: "Бизнес" },         
        { limit: 500000, rate: 0.0035, name: "Профи" },         
        { limit: 1000000, rate: 0.0025, name: "Опт" },          
        { limit: Infinity, rate: 0.001, name: "Супер опт" }   
    ];
    const PRICE_STEP = 100;
    const MIN_PRICE = 500;
    const LEVEL_LABELS = ["Страна", "Регион", "Район", "Город"];
    const LEVEL_PLURALS = ["Все страны", "Все регионы", "Все районы", "Все города"];

    let geoDB = null;       
    let treeData = [];      
    let selectedIds = new Set();
    let indeterminateIds = new Set(); 
    let idCounter = 0;
    let debounceTimer;
    let filterState = [new Set(), new Set(), new Set(), new Set()];

    window.onload = () => {
        document.getElementById('searchInput').addEventListener('input', debounceSearch);
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.custom-select-container')) {
                closeAllDropdowns();
            }
        });
        if (typeof GEO_DB !== 'undefined') {
            geoDB = GEO_DB;
            initFiltersUI();
            runSelectorChain(); 
            document.getElementById('loader').style.display = 'none';
            
            setTimeout(() => startTour(true), 100);
        } else {
            document.getElementById('loaderStatus').innerText = "База не найдена.";
        }
    };

    function initFiltersUI() {
        const container = document.getElementById('geoFilters');
        container.innerHTML = '';
        for (let i = 0; i < 4; i++) {
            const wrap = document.createElement('div');
            wrap.className = 'custom-select-container';
            wrap.id = `filter-wrap-${i}`;
            wrap.innerHTML = `
                <div class="select-trigger disabled" id="trigger-${i}" onclick="toggleDropdown(event, ${i})">${LEVEL_PLURALS[i]}</div>
                <div class="select-dropdown" id="dropdown-${i}"></div>
            `;
            container.appendChild(wrap);
        }
        const sumPanel = document.getElementById('summaryPanel');
        let sumHtml = '';
        for(let i=0; i<4; i++) {
            sumHtml += `<div class="summary-row" id="sum-row-${i}"><div class="summary-label">${LEVEL_LABELS[i]}:</div><div class="summary-value" id="sum-val-${i}">-</div></div>`;
        }
        sumPanel.innerHTML = sumHtml;
    }

    function closeAllDropdowns() {
        document.querySelectorAll('.select-dropdown').forEach(d => d.classList.remove('show'));
        document.querySelectorAll('.custom-select-container').forEach(c => c.classList.remove('is-open'));
    }

    function toggleDropdown(e, idx) {
        const drop = document.getElementById(`dropdown-${idx}`);
        const wrap = document.getElementById(`filter-wrap-${idx}`);
        const isOpen = drop.classList.contains('show');
        closeAllDropdowns();
        if (!isOpen) {
            drop.classList.add('show');
            wrap.classList.add('is-open');
        }
    }

    function syncFiltersUp(changedLevel) {
        if (changedLevel === 0) return; 

        const selectedNames = filterState[changedLevel];
        if (selectedNames.size === 0) return; 

        let paths = [];
        if (geoDB.children) {
            geoDB.children.filter(x => x.type !== 'file').forEach(c => {
                 findDepthMatch(c, [], changedLevel, paths, selectedNames);
            });
        }

        for (let l = changedLevel - 1; l >= 0; l--) {
            const newSet = new Set();
            paths.forEach(path => {
                newSet.add(path[l]);
            });
            filterState[l] = newSet;
        }
    }

    function findDepthMatch(node, parents, targetLevel, resultPaths, targetNames) {
        const currentDepth = parents.length;
        if (currentDepth === targetLevel) {
            if (targetNames.has(node.name)) {
                resultPaths.push([...parents, node.name]);
            }
            return;
        }
        if (node.children) {
             node.children.filter(x => x.type !== 'file').forEach(child => {
                 findDepthMatch(child, [...parents, node.name], targetLevel, resultPaths, targetNames);
             });
        }
    }

    function runSelectorChain() {
        let level0Opts = geoDB.children ? geoDB.children.filter(x => x.type !== 'file') : [];
        updateFilterUI(0, level0Opts);
        let selectedLevel0 = getSelectedNodes(level0Opts, 0);

        let level1Opts = getChildrenFromMultiple(selectedLevel0);
        updateFilterUI(1, level1Opts);
        let selectedLevel1 = getSelectedNodes(level1Opts, 1);

        let level2Opts = getChildrenFromMultiple(selectedLevel1);
        updateFilterUI(2, level2Opts);
        let selectedLevel2 = getSelectedNodes(level2Opts, 2);

        let level3Opts = getChildrenFromMultiple(selectedLevel2);
        updateFilterUI(3, level3Opts);
        let selectedLevel3 = getSelectedNodes(level3Opts, 3);

        updateSummaryPanel();

        let nodesToShow = [];
        if (selectedLevel3.length > 0) nodesToShow = selectedLevel3;
        else if (selectedLevel2.length > 0) nodesToShow = selectedLevel2;
        else if (selectedLevel1.length > 0) nodesToShow = selectedLevel1;
        else if (selectedLevel0.length > 0) nodesToShow = selectedLevel0;
        else nodesToShow = [geoDB];

        updateTreeFromNodes(nodesToShow);
    }

    function updateSummaryPanel() {
        for(let i=0; i<4; i++) {
            const row = document.getElementById(`sum-row-${i}`);
            const val = document.getElementById(`sum-val-${i}`);
            const trigger = document.getElementById(`trigger-${i}`);
            if(trigger.classList.contains('disabled') && trigger.innerText === "—") {
                row.style.display = 'none';
                continue;
            }
            row.style.display = 'flex';
            const set = filterState[i];
            if (set.size === 0) {
                if(trigger.innerText.includes("Все")) val.innerText = "Все";
                else val.innerText = trigger.innerText;
            } else {
                val.innerText = Array.from(set).join(', ');
            }
        }
    }

    function getSelectedNodes(options, idx) {
        if (!options || options.length === 0) return [];
        const selectedNames = filterState[idx];
        if (selectedNames.size === 0) return options;
        return options.filter(o => selectedNames.has(o.name));
    }

    function getChildrenFromMultiple(parents) {
        let allChildren = [];
        parents.forEach(p => {
            if (p.children) allChildren = allChildren.concat(p.children.filter(x => x.type !== 'file'));
        });
        return allChildren;
    }

    function updateFilterUI(idx, options) {
        const trigger = document.getElementById(`trigger-${idx}`);
        const dropdown = document.getElementById(`dropdown-${idx}`);
        let currentSet = filterState[idx];
        const validNames = new Set(options.map(o => o.name));
        
        for (let name of currentSet) {
            if (!validNames.has(name)) currentSet.delete(name);
        }

        if (options.length === 0) {
            trigger.innerText = "—";
            trigger.classList.add('disabled');
            dropdown.innerHTML = '';
            return;
        }

        if (options.length === 1) {
            trigger.innerText = options[0].name;
            trigger.classList.add('disabled');
            dropdown.innerHTML = '';
            return;
        }

        trigger.classList.remove('disabled');
        const isAll = (currentSet.size === 0 || currentSet.size === options.length);
        
        if (isAll) {
            trigger.innerText = LEVEL_PLURALS[idx];
        } else {
            if (currentSet.size <= 2) {
                trigger.innerText = Array.from(currentSet).join(', ');
            } else {
                const arr = Array.from(currentSet);
                trigger.innerText = `${arr[0]}, ${arr[1]} (+${arr.length - 2})`;
            }
        }

        let html = ``;
        html += `
            <div class="select-option select-all-opt ${isAll ? 'selected' : ''}" onclick="clickOption(event, ${idx}, 'ALL')">
                <input type="checkbox" class="select-real-checkbox" ${isAll ? 'checked' : ''} onclick="this.parentElement.click(); event.stopPropagation();">
                <div>${LEVEL_PLURALS[idx]}</div>
            </div>
        `;

        options.forEach(opt => {
            const isSel = currentSet.has(opt.name);
            html += `
                <div class="select-option ${isSel ? 'selected' : ''}" onclick="clickOption(event, ${idx}, '${opt.name}')">
                    <input type="checkbox" class="select-real-checkbox" ${isSel ? 'checked' : ''} onclick="this.parentElement.click(); event.stopPropagation();">
                    <div>${opt.name}</div>
                </div>
            `;
        });
        dropdown.innerHTML = html;
    }

    window.clickOption = function(e, levelIdx, val) {
        if(e) e.stopPropagation();
        const currentSet = filterState[levelIdx];
        const dropdown = document.getElementById(`dropdown-${levelIdx}`);
        const allOptionDivs = dropdown.querySelectorAll('.select-option:not(.select-all-opt)');
        const allNames = Array.from(allOptionDivs).map(div => div.querySelector('div:last-child').innerText);

        if (val === 'ALL') {
             if(currentSet.size > 0) currentSet.clear();
        } else {
            if (currentSet.has(val)) currentSet.delete(val);
            else currentSet.add(val);
            if (currentSet.size === allNames.length) currentSet.clear();
        }
        
        syncFiltersUp(levelIdx);
        runSelectorChain();
    };

    function updateTreeFromNodes(nodesList) {
        document.getElementById('treeContainer').innerHTML = '';
        if(!nodesList || nodesList.length === 0) return;
        let contents = [];
        nodesList.forEach(node => collectContents(node, contents));
        let mergedRoot = [];
        contents.forEach(tree => merge(mergedRoot, tree));
        idCounter = 0; selectedIds.clear(); indeterminateIds.clear();
        treeData = assignIds(mergedRoot, null);
        renderTree(treeData, document.getElementById('treeContainer'), 0);
        recalculate();
    }
    function collectContents(node, list) {
        if (node.type === 'file' && node.file_content) list.push(node.file_content);
        if (node.children) node.children.forEach(c => collectContents(c, list));
    }
    function merge(target, source) {
        source.forEach(src => {
            let tgt = target.find(x => x.name === src.name);
            if (!tgt) { tgt = JSON.parse(JSON.stringify(src)); tgt.children = []; target.push(tgt); } 
            else { tgt.stats.l += src.stats.l; tgt.stats.p += src.stats.p; tgt.stats.e += src.stats.e; }
            if (src.children) merge(tgt.children, src.children);
        });
    }
    function assignIds(nodes, parent) {
        nodes.sort((a,b) => a.name.localeCompare(b.name));
        return nodes.map(n => {
            const node = { ...n, id: idCounter++, parent: parent, expanded: false, visible: true };
            if (n.children) node.children = assignIds(n.children, node);
            return node;
        });
    }
    function renderTree(nodes, container, depth) {
        const ul = document.createElement('ul');
        ul.className = (container.id === 'treeContainer') ? 'root' : 'nested';
        nodes.forEach(node => {
            if (!node.visible || node.stats.l === 0) return;
            const li = document.createElement('li');
            const hasChild = node.children && node.children.length > 0;
            const sel = selectedIds.has(node.id);
            const ind = indeterminateIds.has(node.id);
            
            const row = document.createElement('div');
            row.className = `node-row ${sel ? 'selected' : ''} ${ind ? 'indeterminate' : ''}`;
            
            const left = document.createElement('div');
            left.className = 'row-left'; left.style.paddingLeft = (depth * 20) + 'px';
            
            const tog = document.createElement('div'); 
            if (!hasChild) { tog.className = 'toggler empty'; tog.innerHTML = ''; } 
            else { tog.className = 'toggler'; tog.innerHTML = node.expanded ? '▼' : '▶'; }
            
            const chk = document.createElement('input'); chk.type = 'checkbox'; chk.className='node-checkbox'; chk.checked = sel; chk.indeterminate = ind;
            const name = document.createElement('div'); name.className = 'node-name'; name.innerText = node.name;
            left.append(tog, chk, name);
            const right = document.createElement('div'); right.className = 'row-right';
            right.innerHTML = `<div class="col-fixed"><div class="badge b-lines">${node.stats.l}</div></div><div class="col-fixed"><div class="badge b-phones">${node.stats.p}</div></div><div class="col-fixed"><div class="badge b-emails">${node.stats.e}</div></div>`;
            row.append(left, right);
            li.appendChild(row);
            
            const clickTog = (e) => { e.stopPropagation(); if(!hasChild)return; node.expanded=!node.expanded; document.getElementById('treeContainer').innerHTML=''; renderTree(treeData, document.getElementById('treeContainer'),0); };
            const clickChk = (e) => { e.stopPropagation(); toggleSel(node, !sel); document.getElementById('treeContainer').innerHTML=''; renderTree(treeData, document.getElementById('treeContainer'),0); recalculate(); };
            
            tog.onclick = clickTog; chk.onclick = clickChk; row.onclick = (e) => { if(e.target!==chk && e.target!==tog) clickTog(e); };
            if (node.expanded && hasChild) { renderTree(node.children, li, depth + 1); li.querySelector('ul.nested').style.display = 'block'; }
            ul.appendChild(li);
        });
        container.appendChild(ul);
    }
    
    function toggleSel(node, state) {
        function setAll(n, s) {
            if(s) { selectedIds.add(n.id); indeterminateIds.delete(n.id); } else { selectedIds.delete(n.id); indeterminateIds.delete(n.id); }
            if(n.children) n.children.forEach(c => setAll(c, s));
        }
        setAll(node, state);
        let curr = node.parent; while(curr) { updatePar(curr); curr = curr.parent; }
    }
    function updatePar(node) {
        if(!node.children) return;
        let all=true, none=true;
        node.children.forEach(c => { const s = selectedIds.has(c.id), i = indeterminateIds.has(c.id); if(!s) all=false; if(s||i) none=false; });
        if(all) { selectedIds.add(node.id); indeterminateIds.delete(node.id); } else if(none) { selectedIds.delete(node.id); indeterminateIds.delete(node.id); } else { selectedIds.delete(node.id); indeterminateIds.add(node.id); }
    }
    
    function recalculate() {
        let l=0, p=0, e=0;
        function trav(nodes) {
            nodes.forEach(n => { 
                if (selectedIds.has(n.id)) { l+=n.stats.l; p+=n.stats.p; e+=n.stats.e; } 
                else if (indeterminateIds.has(n.id) || (n.children && n.children.length)) trav(n.children); 
            });
        }
        trav(treeData);
        
        const vol = l;
        let finalUnrounded = 0;
        let remainingVol = vol;
        let previousLimit = 0;

        for (let i = 0; i < TIERS.length; i++) {
            let maxInThisTier = TIERS[i].limit - previousLimit;
            let take = Math.min(remainingVol, maxInThisTier);
            if (take > 0) {
                finalUnrounded += take * TIERS[i].rate;
                remainingVol -= take;
            }
            previousLimit = TIERS[i].limit;
            if (remainingVol <= 0) break;
        }

        let final = Math.ceil(finalUnrounded / PRICE_STEP) * PRICE_STEP;
        if(vol > 0 && final < MIN_PRICE) final = MIN_PRICE;
        
        document.getElementById('selLines').innerText = l.toLocaleString(); 
        document.getElementById('selPhones').innerText = p.toLocaleString(); 
        document.getElementById('selEmails').innerText = e.toLocaleString(); 
        document.getElementById('totalPrice').innerText = final.toLocaleString();
        
        let activeTierIdx = 0;
        for (let i = 0; i < TIERS.length; i++) {
            if (vol < TIERS[i].limit) {
                activeTierIdx = i;
                break;
            }
        }
        if (vol >= TIERS[TIERS.length - 1].limit) activeTierIdx = TIERS.length - 1;
        
        const box = document.getElementById('bonusBox'); 
        const bucketFill = document.getElementById('bucketFill'); 
        const bonusText = document.getElementById('bonusText'); 
        const bonusTitle = document.getElementById('bonusTitle'); 
        const bonusPercent = document.getElementById('bonusPercent');
        
        if (vol === 0) { 
            box.classList.remove('active'); 
            bucketFill.style.width = '0%'; 
            bonusText.innerText = "Выберите данные, чтобы увидеть скидку."; 
            bonusTitle.innerText = "Скидки"; 
            bonusPercent.innerText = "0%"; 
        } else {
            box.classList.add('active'); 
            const currentTier = TIERS[activeTierIdx];
            const nextTier = TIERS[activeTierIdx + 1];
            
            if (nextTier) { 
                const prevLimit = activeTierIdx === 0 ? 0 : TIERS[activeTierIdx - 1].limit;
                const currentLimit = currentTier.limit;
                const progressInCurrentTier = vol - prevLimit;
                const sizeOfCurrentTier = currentLimit - prevLimit;
                const needed = currentLimit - vol; 
                const percent = Math.min(100, Math.round((progressInCurrentTier / sizeOfCurrentTier) * 100)); 
                
                bonusTitle.innerText = "До цены " + nextTier.rate + "₽"; 
                bonusPercent.innerText = percent + "%"; 
                bucketFill.style.width = percent + '%'; 
                bonusText.innerHTML = `Вы в диапазоне <b>${currentTier.name}</b>. Выберите ещё <b>${needed.toLocaleString()}</b> строк, чтобы цена следующих контактов снизилась до <b>${nextTier.rate}₽</b>.`; 
            } else { 
                bonusTitle.innerText = "Максимум"; 
                bonusPercent.innerText = "100%"; 
                bucketFill.style.width = '100%'; 
                bonusText.innerHTML = `Вы достигли диапазона <b>${currentTier.name}</b>! Максимальная выгода.`; 
            }
        }
        
        const tCon = document.getElementById('tierListContainer'); 
        tCon.innerHTML = ''; 
        TIERS.forEach((t, i) => { 
            let prevLimit = i === 0 ? 0 : TIERS[i-1].limit;
            let label = "";
            if (t.limit === Infinity) {
                label = `от ${(prevLimit/1000)}к`;
            } else if (i === 0) {
                label = `до ${(t.limit/1000)}к`;
            } else {
                label = `${(prevLimit/1000)}к - ${(t.limit/1000)}к`;
            }
            tCon.innerHTML += `<div class="tier-item ${i === activeTierIdx ? 'current' : ''} ${i < activeTierIdx ? 'passed' : ''}"><div>${t.name} <small style="opacity:0.6; font-weight:400">(${label})</small></div><div>${t.rate}₽</div></div>`; 
        });
    }

    function debounceSearch() { clearTimeout(debounceTimer); debounceTimer = setTimeout(runSearch, 300); }
    function runSearch() {
        const q = document.getElementById('searchInput').value.toLowerCase();
        const filter = (n) => {
            const match = n.name.toLowerCase().includes(q); let childMatch = false;
            if(n.children) n.children.forEach(c => { if(filter(c)) childMatch=true; });
            n.visible = match || childMatch; if(q && childMatch) n.expanded=true; else if(!q) n.expanded=false;
            return n.visible;
        }
        treeData.forEach(filter); document.getElementById('treeContainer').innerHTML=''; renderTree(treeData, document.getElementById('treeContainer'), 0);
    }
    function getPath(node) { let path = [node.name], curr = node.parent; while(curr) { path.unshift(curr.name); curr = curr.parent; } return path.join(" / "); }
    function downloadOrder() {
        if(!selectedIds.size && !indeterminateIds.size) return alert('Пусто');
        let filtersTxt = "";
        for(let i=0; i<4; i++) {
             const row = document.getElementById(`sum-row-${i}`);
             const val = document.getElementById(`sum-val-${i}`);
             if(row.style.display !== 'none') {
                 filtersTxt += `[${LEVEL_LABELS[i]}: ${val.innerText}] `;
             }
        }
        let txt = `ЗАКАЗ\nФильтры: ${filtersTxt}\nСумма: ${document.getElementById('totalPrice').innerText}\n---\n`;
        function w(nodes) { nodes.forEach(n => { if(selectedIds.has(n.id)) txt += `[+] ${getPath(n)} (${n.stats.l})\n`; else if(n.children) w(n.children); }); }
        w(treeData); const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], {type:'text/plain'})); a.download = 'Order.txt'; a.click();
    }
    function resetAll() { location.reload(); }

    /* ================= ONBOARDING TOUR LOGIC ================= */
    const TOUR_STEPS = [
        { target: '#searchInput', title: '🔍 Поиск', text: 'Удобный сквозной поиск. Просто начните вводить название категории для быстрого поиска', bgFix: true },
        { target: '#geoFilters', title: '🌍 Умные фильтры', text: 'Позволяют мгновенно отсечь ненужные локации. Фильтры каскадные: выбрав страну, регионы и города обновятся автоматически.', bgFix: false },
        { target: '#summaryPanel', title: '📋 Сводка', text: 'Здесь всегда можно посмотреть текущие активные фильтры, чтобы не потеряться в выборке.', bgFix: true },
        { target: '.tree-wrapper', title: '📁 Выбор баз', text: 'Основное рабочее окно. Раскрывайте папки и отмечайте галочками базы, которые хотите добавить в заказ.', bgFix: true },
        { target: '.total-box', title: '💰 Стоимость', text: 'Итоговая стоимость рассчитывается автоматически. Учитывается минимальный шаг и сумма заказа.', bgFix: false },
        { target: '.stats-grid', title: '📊 Выбранные контакты', text: 'Здесь отображается точное количество выбранных строк, а также уникальных телефонов и email-адресов.', bgFix: false },
        { target: '.tier-section', title: '📉 Прогрессивная скидка', text: 'Чем больший объем вы собираете, тем дешевле обходится каждая следующая строка. Здесь видно, как близко вы к новому уровню скидки.', bgFix: true },
        { target: '.btn-download', title: '🚀 Заказ', text: 'Когда соберете нужный объем, нажмите кнопку скачивания. Система создаст готовый TXT файл для отправки менеджеру.', bgFix: false },
        { target: '.btn-reset', title: '🔄 Сброс', text: 'Если нужно начать выбор баз с нуля, просто нажмите эту кнопку для сброса всех настроек.', bgFix: false }
    ];
    
    let currentTourStep = 0;

    function startTour(force = false) {
        if (!force && localStorage.getItem('smartBaseTourDone')) return;
        currentTourStep = 0;
        showTourStep();
    }

    function showTourStep() {
        document.querySelectorAll('.tour-highlight, .tour-bg-fix, .tour-no-clip').forEach(el => {
            el.classList.remove('tour-highlight', 'tour-bg-fix', 'tour-no-clip');
        });

        const step = TOUR_STEPS[currentTourStep];
        const target = document.querySelector(step.target);
        
        if (!target) { endTour(); return; }

        let parent = target.parentElement;
        while(parent && parent !== document.body) {
            const style = window.getComputedStyle(parent);
            if (style.overflow !== 'visible') {
                parent.classList.add('tour-no-clip');
            }
            parent = parent.parentElement;
        }

        target.classList.add('tour-highlight');
        
        if (step.bgFix) {
            target.classList.add('tour-bg-fix');
        }

        document.getElementById('tourTitle').innerText = step.title;
        document.getElementById('tourText').innerText = step.text;
        
        const dots = document.getElementById('tourDots');
        dots.innerHTML = TOUR_STEPS.map((_, i) => `<div class="tour-dot ${i === currentTourStep ? 'active' : ''}"></div>`).join('');
        
        const nextBtn = document.getElementById('tourNextBtn');
        nextBtn.innerText = currentTourStep === TOUR_STEPS.length - 1 ? 'Завершить' : 'Далее';

        const tooltip = document.getElementById('tourTooltip');
        tooltip.style.display = 'flex';
        
        target.scrollIntoView({ behavior: 'smooth', block: 'center' });

        const rect = target.getBoundingClientRect();
        
        // Исправлено: центрируем относительно новой ширины тултипа 380px (половина - 190px)
        let top = rect.bottom + 20;
        let left = rect.left + (rect.width / 2) - 190; 

        if (left < 20) left = 20;
        if (left + 380 > window.innerWidth) left = window.innerWidth - 400;
        
        const tipHeight = tooltip.offsetHeight || 180;
        if (top + tipHeight > window.innerHeight) {
            top = rect.top - tipHeight - 20;
            if (top < 20) top = 20; 
        }

        tooltip.style.top = top + 'px';
        tooltip.style.left = left + 'px';
        
        setTimeout(() => tooltip.classList.add('visible'), 10);
    }

    function nextTourStep() {
        if (currentTourStep >= TOUR_STEPS.length - 1) {
            endTour();
        } else {
            currentTourStep++;
            showTourStep();
        }
    }

    function endTour() {
        const tooltip = document.getElementById('tourTooltip');
        tooltip.classList.remove('visible');
        setTimeout(() => { tooltip.style.display = 'none'; }, 300);
        
        document.querySelectorAll('.tour-highlight, .tour-bg-fix, .tour-no-clip').forEach(el => {
            el.classList.remove('tour-highlight', 'tour-bg-fix', 'tour-no-clip');
        });
        
        localStorage.setItem('smartBaseTourDone', 'true'); 
    }
</script>
