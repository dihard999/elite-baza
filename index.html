<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base Manager</title>
    <script src="database.js"></script>
    <style>
        :root { --bg: #f8fafc; --text: #0f172a; --border: #e2e8f0; --primary: #2563eb; --green: #16a34a; }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* SIDEBAR */
        .sidebar { width: 360px; background: #fff; border-right: 1px solid var(--border); display: flex; flex-direction: column; z-index: 10; box-shadow: 4px 0 20px rgba(0,0,0,0.05); }
        .sb-content { padding: 20px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 15px; }
        
        .price-box { background: linear-gradient(135deg, #2563eb, #1e40af); color: white; padding: 20px; border-radius: 12px; text-align: center; }
        .price-val { font-size: 2.5rem; font-weight: 800; line-height: 1; }
        .tier-list { border-top: 1px solid var(--border); padding-top: 10px; display: flex; flex-direction: column; gap: 5px; }
        .tier-row { display: flex; justify-content: space-between; padding: 6px 10px; font-size: 0.85rem; border-radius: 6px; color: #64748b; }
        .tier-row.active { background: #eff6ff; color: var(--primary); font-weight: 700; border: 1px solid #bfdbfe; }

        .btn { width: 100%; padding: 12px; background: #0f172a; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
        .btn-reset { background: white; color: #ef4444; border: 1px solid #fecaca; margin-top: 10px; }

        /* MAIN */
        .main { flex: 1; display: flex; flex-direction: column; background: #fff; }
        .filters { padding: 15px 25px; border-bottom: 1px solid var(--border); background: #f8fafc; display: flex; flex-direction: column; gap: 10px; }
        
        .geo-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        select { padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; width: 100%; background: white; cursor: pointer; }
        select:disabled { background: #f1f5f9; color: #94a3b8; cursor: not-allowed; }

        .tree-head { display: flex; padding: 10px 25px; border-bottom: 1px solid var(--border); font-size: 0.75rem; font-weight: 700; text-transform: uppercase; color: #64748b; background: #fff; }
        .col-name { flex: 1; } .col-stat { width: 80px; text-align: center; }

        .tree-body { flex: 1; overflow-y: auto; padding: 0 25px 20px 25px; }
        ul { list-style: none; padding: 0; margin: 0; }
        .node { display: flex; align-items: center; padding: 5px 0; border-bottom: 1px solid #f1f5f9; cursor: pointer; }
        .node:hover { background: #f8fafc; }
        .node.sel { background: #eff6ff; }
        .node.ind { background: #fff7ed; }
        
        .tog { width: 20px; text-align: center; color: #94a3b8; margin-right: 5px; cursor: pointer; user-select: none; }
        input[type="checkbox"] { margin-right: 10px; cursor: pointer; width: 16px; height: 16px; accent-color: var(--primary); }
        .name { flex: 1; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .stat { width: 80px; text-align: center; font-size: 0.85rem; font-weight: 600; }
        
        /* Сообщение об ошибке */
        .error-msg { position:fixed; inset:0; background:rgba(255,255,255,0.95); z-index:99; display:none; justify-content:center; align-items:center; color: #dc2626; font-weight:bold; }
    </style>
</head>
<body>

<div class="error-msg" id="errorBox">Файл database.js не найден! Запустите python build.py</div>

<div class="sidebar">
    <div class="sb-content">
        <div class="price-box">
            <div style="opacity:0.8; font-size:0.8rem; text-transform:uppercase; margin-bottom:5px">Итого</div>
            <div class="price-val"><span id="totalPrice">0</span>₽</div>
            <div style="opacity:0.8; font-size:0.8rem; margin-top:5px">Выбрано строк: <span id="totalLines">0</span></div>
        </div>
        <div class="tier-list" id="tiers"></div>
        <div style="margin-top:auto">
            <button class="btn" onclick="download()">⬇ Скачать заказ</button>
            <button class="btn btn-reset" onclick="resetAll()">Сброс выбора</button>
        </div>
    </div>
</div>

<div class="main">
    <div class="filters">
        <input type="text" id="search" placeholder="🔍 Поиск категории (например: Логистика)..." style="width:100%; padding:10px; border:1px solid #cbd5e1; border-radius:6px">
        <div class="geo-grid">
            <select id="sCountry"><option value="">🌍 Страна</option></select>
            <select id="sRegion" disabled><option value="">🏳️ Регион</option></select>
            <select id="sDistrict" disabled><option value="">🏙️ Район</option></select>
            <select id="sCity" disabled><option value="">📍 Город</option></select>
        </div>
    </div>
    <div class="tree-head">
        <div class="col-name">Название</div>
        <div class="col-stat">Строк</div>
        <div class="col-stat" style="color:var(--primary)">Тел</div>
        <div class="col-stat" style="color:var(--green)">Email</div>
    </div>
    <div class="tree-body" id="tree"></div>
</div>

<script>
    // === ЦЕНЫ ===
    const TIERS = [
        { l: 1000, r: 0.10, n: "Новичок" }, { l: 5000, r: 0.075, n: "Старт" },
        { l: 10000, r: 0.06, n: "Активный" }, { l: 50000, r: 0.04, n: "Бизнес" },
        { l: 100000, r: 0.03, n: "Профи" }, { l: Infinity, r: 0.005, n: "Опт" }
    ];
    
    let geoDB = null;       // Вся база гео
    let activeTree = [];    // Склеенное дерево категорий для текущего фильтра
    let selected = new Set();
    let semi = new Set();   // Частично выбранные
    let uidCounter = 0;
    
    // Элементы
    const S = { c: document.getElementById('sCountry'), r: document.getElementById('sRegion'), d: document.getElementById('sDistrict'), t: document.getElementById('sCity') };

    window.onload = () => {
        if(typeof GEO_DB === 'undefined') {
            document.getElementById('errorBox').style.display = 'flex';
            return;
        }
        geoDB = GEO_DB;
        
        // Заполняем страны
        fillSelect(S.c, geoDB.children);
        
        // Показываем всё сразу (или пусто, если база пустая)
        updateTree(geoDB);
        
        document.getElementById('search').oninput = (e) => render(activeTree, document.getElementById('tree'), 0, e.target.value);
    };

    // === ГЕО ЛОГИКА ===
    S.c.onchange = () => {
        const n = findNode(geoDB.children, S.c.value);
        resetSelects(['r','d','t']);
        if(n) { fillSelect(S.r, n.children); S.r.disabled=false; updateTree(n); } else updateTree(geoDB);
    };
    S.r.onchange = () => {
        const c = findNode(geoDB.children, S.c.value);
        const n = findNode(c.children, S.r.value);
        resetSelects(['d','t']);
        if(n) { fillSelect(S.d, n.children); S.d.disabled=false; updateTree(n); }
    };
    S.d.onchange = () => {
        const c = findNode(geoDB.children, S.c.value);
        const r = findNode(c.children, S.r.value);
        const n = findNode(r.children, S.d.value);
        resetSelects(['t']);
        if(n) { fillSelect(S.t, n.children); S.t.disabled=false; updateTree(n); }
    };
    S.t.onchange = () => {
        const c = findNode(geoDB.children, S.c.value);
        const r = findNode(c.children, S.r.value);
        const d = findNode(r.children, S.d.value);
        const n = findNode(d.children, S.t.value);
        if(n) updateTree(n);
    };

    function findNode(arr, name) { return arr ? arr.find(x => x.name === name) : null; }
    function fillSelect(el, arr) {
        el.innerHTML = '<option value="">'+el.options[0].text+'</option>';
        if(!arr) return;
        arr.forEach(x => { if(x.type!=='file_content') el.add(new Option(x.name, x.name)); });
    }
    function resetSelects(keys) { keys.forEach(k => { S[k].value=""; S[k].disabled=true; }); }

    // === СБОРКА И МЕРДЖ ДЕРЕВА ===
    function updateTree(geoNode) {
        // 1. Собираем контент всех файлов внутри geoNode
        let allContents = [];
        collectFiles(geoNode, allContents);
        
        // 2. Склеиваем (merge) их в одно дерево
        let mergedRoot = [];
        allContents.forEach(tree => mergeTrees(mergedRoot, tree));
        
        // 3. Раздаем ID для UI
        uidCounter = 0;
        selected.clear(); semi.clear();
        activeTree = assignIds(mergedRoot, null);
        
        // 4. Рендер
        render(activeTree, document.getElementById('tree'), 0);
        calcPrice();
    }

    function collectFiles(node, list) {
        if(node.type === 'file' && node.file_content) list.push(node.file_content);
        if(node.children) node.children.forEach(c => collectFiles(c, list));
    }

    // Глубокое слияние деревьев (суммируем цифры у одинаковых категорий)
    function mergeTrees(target, source) {
        source.forEach(srcNode => {
            let tgtNode = target.find(x => x.name === srcNode.name);
            if(!tgtNode) {
                // Копируем узел
                tgtNode = JSON.parse(JSON.stringify(srcNode));
                tgtNode.children = []; // Детей будем мержить отдельно
                target.push(tgtNode);
            } else {
                // Суммируем стату
                tgtNode.stats.l += srcNode.stats.l;
                tgtNode.stats.p += srcNode.stats.p;
                tgtNode.stats.e += srcNode.stats.e;
            }
            // Рекурсия для детей
            if(srcNode.children) mergeTrees(tgtNode.children, srcNode.children);
        });
    }

    function assignIds(nodes, parent) {
        // Сортируем по имени для красоты
        nodes.sort((a,b) => a.name.localeCompare(b.name));
        return nodes.map(n => {
            const node = { ...n, id: uidCounter++, parent: parent, expand: false };
            if(n.children) node.children = assignIds(n.children, node);
            return node;
        });
    }

    // === РЕНДЕР ===
    function render(nodes, container, depth, filter="") {
        if(depth===0) container.innerHTML = '';
        const ul = document.createElement('ul');
        
        nodes.forEach(node => {
            // Фильтр поиска
            if(filter && !hasMatch(node, filter)) return;
            // Скрываем пустые (если вдруг 0)
            if(node.stats.l === 0) return;

            const li = document.createElement('li');
            const row = document.createElement('div');
            
            const isSel = selected.has(node.id);
            const isSemi = semi.has(node.id);
            const hasChild = node.children && node.children.length > 0;

            row.className = `node ${isSel?'sel':''} ${isSemi?'ind':''}`;
            row.style.paddingLeft = (depth*20)+'px';
            
            // Стрелка
            const tog = document.createElement('span');
            tog.className = 'tog';
            tog.innerHTML = hasChild ? (node.expand || filter ? '▼' : '▶') : '•';
            tog.style.opacity = hasChild ? 1 : 0.3;
            tog.onclick = (e) => {
                e.stopPropagation();
                if(hasChild) {
                    node.expand = !node.expand;
                    render(activeTree, document.getElementById('tree'), 0, filter);
                }
            };

            // Чекбокс
            const chk = document.createElement('input');
            chk.type = 'checkbox';
            chk.checked = isSel;
            chk.indeterminate = isSemi;
            chk.onclick = (e) => {
                e.stopPropagation();
                toggle(node, !isSel);
                render(activeTree, document.getElementById('tree'), 0, filter);
                calcPrice();
            };

            row.append(tog, chk);
            row.innerHTML += `
                <div class="name">${node.name}</div>
                <div class="stat" style="color:#64748b">${node.stats.l}</div>
                <div class="stat" style="color:var(--primary)">${node.stats.p}</div>
                <div class="stat" style="color:var(--green)">${node.stats.e}</div>
            `;
            
            // Клик по строке = клик по стрелке
            row.onclick = (e) => { if(e.target !== chk) tog.click(); };

            li.appendChild(row);

            // Дети
            if(hasChild && (node.expand || filter)) {
                const sub = document.createElement('div');
                li.appendChild(sub);
                // Рендерим фрагмент (рекурсия)
                sub.appendChild(renderFragment(node.children, depth+1, filter));
            }
            ul.appendChild(li);
        });
        
        if(depth===0) container.appendChild(ul);
        return ul;
    }

    function renderFragment(nodes, depth, filter) {
        // Вспомогательная функция для рендера поддеревьев без очистки контейнера
        const ul = document.createElement('ul');
        nodes.forEach(node => {
            if(filter && !hasMatch(node, filter)) return;
            if(node.stats.l === 0) return;

            const li = document.createElement('li');
            const row = document.createElement('div');
            const isSel = selected.has(node.id);
            const isSemi = semi.has(node.id);
            const hasChild = node.children && node.children.length > 0;

            row.className = `node ${isSel?'sel':''} ${isSemi?'ind':''}`;
            row.style.paddingLeft = (depth*20)+'px';

            const tog = document.createElement('span');
            tog.className = 'tog';
            tog.innerHTML = hasChild ? (node.expand || filter ? '▼' : '▶') : '•';
            tog.onclick = (e) => { e.stopPropagation(); node.expand = !node.expand; render(activeTree, document.getElementById('tree'), 0, filter); };

            const chk = document.createElement('input');
            chk.type = 'checkbox';
            chk.checked = isSel; chk.indeterminate = isSemi;
            chk.onclick = (e) => { e.stopPropagation(); toggle(node, !isSel); render(activeTree, document.getElementById('tree'), 0, filter); calcPrice(); };

            row.append(tog, chk);
            row.innerHTML += `<div class="name">${node.name}</div><div class="stat" style="color:#64748b">${node.stats.l}</div><div class="stat" style="color:var(--primary)">${node.stats.p}</div><div class="stat" style="color:var(--green)">${node.stats.e}</div>`;
            li.appendChild(row);

            if(hasChild && (node.expand || filter)) {
                const sub = document.createElement('div');
                li.appendChild(sub);
                sub.appendChild(renderFragment(node.children, depth+1, filter));
            }
            ul.appendChild(li);
        });
        return ul;
    }

    function hasMatch(node, filter) {
        if(node.name.toLowerCase().includes(filter.toLowerCase())) return true;
        return node.children && node.children.some(c => hasMatch(c, filter));
    }

    // === ВЫДЕЛЕНИЕ ===
    function toggle(node, state) {
        // Вниз
        function setDown(n, s) {
            if(s) { selected.add(n.id); semi.delete(n.id); } 
            else { selected.delete(n.id); semi.delete(n.id); }
            if(n.children) n.children.forEach(c => setDown(c, s));
        }
        setDown(node, state);
        
        // Вверх
        let curr = node.parent;
        while(curr) {
            let all=true, none=true;
            curr.children.forEach(c => {
                if(!selected.has(c.id)) all=false;
                if(selected.has(c.id) || semi.has(c.id)) none=false;
            });
            if(all) { selected.add(curr.id); semi.delete(curr.id); }
            else if(none) { selected.delete(curr.id); semi.delete(curr.id); }
            else { selected.delete(curr.id); semi.add(curr.id); }
            curr = curr.parent;
        }
    }

    // === КАЛЬКУЛЯТОР ===
    function calcPrice() {
        let l=0, p=0, e=0;
        
        // Считаем только "верхушки" выбранного, чтобы не дублировать
        function sum(nodes) {
            nodes.forEach(n => {
                if(selected.has(n.id)) {
                    l += n.stats.l; p += n.stats.p; e += n.stats.e;
                } else if(semi.has(n.id) || !n.parent) {
                    // Если частично или корень - идем внутрь
                    if(n.children) sum(n.children);
                }
            });
        }
        sum(activeTree);

        document.getElementById('totalLines').innerText = l.toLocaleString();
        
        // Тарифы
        const vol = l+p+e;
        let cur = TIERS[0], idx=0;
        for(let i=0; i<TIERS.length; i++) if(vol < TIERS[i].l) { cur=TIERS[i]; idx=i; break; }
        if(vol >= TIERS[5].l) { cur=TIERS[5]; idx=5; } // Опт

        let cost = Math.ceil((vol * cur.r) / 500) * 500;
        if(cost===0 && vol>0) cost=500;
        
        document.getElementById('totalPrice').innerText = cost.toLocaleString();
        
        // Подсветка тарифа
        const tBox = document.getElementById('tiers');
        tBox.innerHTML = TIERS.map((t,i) => 
            `<div class="tier-row ${i===idx?'active':''}"><span>${t.n}</span><span>${t.r}₽</span></div>`
        ).join('');
    }

    function resetAll() {
        selected.clear(); semi.clear();
        render(activeTree, document.getElementById('tree'), 0);
        calcPrice();
    }

    function download() {
        if(!selected.size && !semi.size) return alert('Ничего не выбрано!');
        let txt = `ЗАКАЗ\nРегион: ${S.c.value}/${S.r.value}/${S.t.value}\nСумма: ${document.getElementById('totalPrice').innerText} руб\n---\n`;
        
        function write(n) {
            if(selected.has(n.id)) {
                // Получаем путь категории
                let path = n.name;
                let p = n.parent;
                while(p && p.parent) { path = p.name + " / " + path; p = p.parent; }
                txt += `[+] ${path} (${n.stats.l})\n`;
            } else if(n.children) {
                n.children.forEach(write);
            }
        }
        activeTree.forEach(write);
        
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([txt], {type:'text/plain'}));
        a.download = 'Order.txt';
        a.click();
    }
</script>

</body>
</html>
