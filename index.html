<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Конструктор Базы: Level Up</title>
    <style>
        :root {
            --bg-body: #f8fafc;       
            --bg-sidebar: #ffffff;    
            --text-main: #1e293b;     
            --text-muted: #64748b;    
            --border: #e2e8f0;        
            
            --c-lines-bg: #f1f5f9;    --c-lines-text: #475569; 
            --c-phones-bg: #dbeafe;   --c-phones-text: #1e40af; 
            --c-emails-bg: #dcfce7;   --c-emails-text: #166534; 
            
            --primary: #2563eb;
            --success: #16a34a;
            --level: #6366f1; /* Indigo для уровней */
        }

        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; 
            background: var(--bg-body); 
            color: var(--text-main); 
            margin: 0; display: flex; height: 100vh; overflow: hidden; 
        }
        
        /* --- SIDEBAR --- */
        .sidebar { 
            width: 380px; /* Чуть шире для шкал */
            background: var(--bg-sidebar); border-right: 1px solid var(--border); 
            display: flex; flex-direction: column; z-index: 20; 
            box-shadow: 10px 0 30px -10px rgba(0,0,0,0.05);
            padding-top: 20px;
        }

        .sidebar-content { padding: 20px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 15px;}

        /* TOTAL BOX */
        .total-box {
            background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%);
            color: white; padding: 25px 20px; border-radius: 16px; text-align: center;
            box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.4);
        }
        .total-label { font-size: 0.8rem; opacity: 0.9; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px;}
        .total-value { font-size: 2.5rem; font-weight: 800; line-height: 1; }
        .tier-badge {
            background: rgba(255,255,255,0.2); padding: 4px 12px; border-radius: 20px;
            font-size: 0.85rem; font-weight: 700; display: inline-block; margin-top: 10px;
            border: 1px solid rgba(255,255,255,0.3);
        }

        /* LEVEL UP BOX (NEW) */
        .level-box {
            background: #eef2ff; border: 1px solid #c7d2fe; border-radius: 12px; padding: 12px 15px;
            display: none; /* Hidden if max level */
        }
        .level-box.active { display: block; }
        .level-header { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 5px; font-weight: 600; color: #4338ca; }
        .level-info { font-size: 0.8rem; color: #6366f1; margin-bottom: 8px; }
        
        .level-bar-bg { height: 8px; background: #c7d2fe; border-radius: 4px; overflow: hidden; }
        .level-bar-fill { height: 100%; background: #4f46e5; width: 0%; transition: width 0.4s ease; }

        /* BONUS BOX */
        .bonus-box {
            background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 12px; padding: 12px 15px;
            text-align: center; display: none;
        }
        .bonus-box.active { display: block; animation: popIn 0.3s ease; }
        @keyframes popIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        
        .bonus-title { color: var(--success); font-weight: 700; font-size: 0.9rem; margin-bottom: 4px; }
        .bonus-text { font-size: 0.8rem; color: #15803d; margin-bottom: 8px; }
        .progress-bg { height: 8px; background: #dcfce7; border-radius: 4px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--success); width: 0%; transition: width 0.3s; }

        /* STATS */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; text-align: center; margin-top: 5px; }
        .stat-item { background: #f8fafc; padding: 8px; border-radius: 8px; border: 1px solid var(--border); }
        .stat-num { display: block; font-weight: 700; font-size: 0.95rem; color: var(--text-main); }
        .stat-lbl { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; }

        /* BUTTONS */
        .actions { margin-top: auto; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; margin-bottom: 8px; transition: 0.2s; font-size: 0.9rem;}
        .btn-download { background: #1e293b; color: white; }
        .btn-download:hover { background: #334155; }
        .btn-reset { background: transparent; color: #ef4444; border: 1px solid #fecaca; }
        .btn-reset:hover { background: #fef2f2; }

        /* MAIN AREA */
        .main { flex: 1; display: flex; flex-direction: column; }
        .toolbar { padding: 15px 30px; background: var(--bg-sidebar); border-bottom: 1px solid var(--border); }
        .search-input { width: 100%; padding: 10px 15px; font-size: 1rem; border: 1px solid var(--border); border-radius: 8px; box-sizing: border-box; background: var(--bg-body);}

        .tree-wrapper { flex: 1; overflow-y: auto; padding: 0 30px 20px 30px; }
        ul { list-style: none; padding: 0; margin: 0; }
        
        .table-header {
            position: sticky; top: 0; z-index: 10; background: var(--bg-body); 
            padding-top: 20px; padding-bottom: 10px; border-bottom: 1px solid var(--border);
            font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px;
            display: flex;
        }
        .header-pad { padding-left: 58px; flex: 1; } 
        .col-fixed { width: 80px; text-align: center; }

        .node-row { display: flex; align-items: center; padding: 6px 0; border-radius: 6px; cursor: pointer; border: 1px solid transparent; margin-bottom: 2px; }
        .node-row:hover { background: #f1f5f9; }
        .node-row.selected { background: #eff6ff; border-color: #bfdbfe; }
        .node-row.is-root-node { background: #f8fafc; border-color: #cbd5e1; font-weight: 700; margin-bottom: 10px; margin-top: 10px; padding: 10px 0; }
        .node-row.is-root-node.selected { background: #dbeafe; border-color: #2563eb; }

        .row-left { flex: 1; display: flex; align-items: center; overflow: hidden; padding-right: 15px; }
        .row-right { display: flex; gap: 8px; }
        .toggler { width: 24px; display: flex; justify-content: center; margin-right: 8px; color: var(--text-muted); flex-shrink: 0;}
        input[type="checkbox"] { width: 16px; height: 16px; margin-right: 15px; cursor: pointer; accent-color: var(--primary); flex-shrink: 0; }
        .node-name { font-weight: 500; font-size: 0.9rem; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .badge { padding: 4px 0; border-radius: 6px; font-size: 0.85rem; font-weight: 700; display: flex; justify-content: center; width: 100%; }
        .b-lines { background: var(--c-lines-bg); color: var(--c-lines-text); }
        .b-phones { background: var(--c-phones-bg); color: var(--c-phones-text); }
        .b-emails { background: var(--c-emails-bg); color: var(--c-emails-text); }
        
        .loader { position: fixed; inset: 0; background: rgba(255,255,255,0.95); z-index: 999; display: flex; justify-content: center; align-items: center; flex-direction: column; }
        .spinner { width: 50px; height: 50px; border: 4px solid #e2e8f0; border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error-box { display: none; color: #dc2626; background: #fee2e2; padding: 20px; border-radius: 8px; }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="sidebar-content">
        <div class="total-box">
            <div class="total-label">К оплате (Шаг 500₽)</div>
            <div class="total-value"><span id="totalPrice">0</span>₽</div>
            <div class="tier-badge" id="currentTierBadge">Новичок</div>
        </div>

        <div class="level-box" id="levelBox">
            <div class="level-header">
                <span>Следующий уровень</span>
                <span id="nextTierRate">0.075₽</span>
            </div>
            <div class="level-info">
                Соберите еще <b id="toNextLevel">0</b> записей, чтобы снизить цену!
            </div>
            <div class="level-bar-bg">
                <div class="level-bar-fill" id="levelProgress"></div>
            </div>
        </div>

        <div class="bonus-box" id="bonusBox">
            <div class="bonus-title">🎁 Бонус к текущему пакету</div>
            <div class="bonus-text">В эту цену (500₽) влезает еще <b id="freeCount">0</b> записей. Берите, это бесплатно!</div>
            <div class="progress-bg">
                <div class="progress-fill" id="bonusProgress"></div>
            </div>
        </div>
        
        <div class="stats-grid">
            <div class="stat-item">
                <span class="stat-num" id="selLines" style="color:var(--c-lines-text)">0</span>
                <span class="stat-lbl">Строк</span>
            </div>
            <div class="stat-item">
                <span class="stat-num" id="selPhones" style="color:var(--c-phones-text)">0</span>
                <span class="stat-lbl">Тел</span>
            </div>
            <div class="stat-item">
                <span class="stat-num" id="selEmails" style="color:var(--c-emails-text)">0</span>
                <span class="stat-lbl">Email</span>
            </div>
        </div>

        <div class="actions">
            <button class="btn btn-download" onclick="downloadOrder()">⬇ Скачать заказ (.txt)</button>
            <button class="btn btn-reset" onclick="resetAll()">Сбросить выбор</button>
        </div>
    </div>
</div>

<div class="main">
    <div class="toolbar">
        <input type="text" id="searchInput" class="search-input" placeholder="🔍 Поиск (регион, категория)...">
    </div>
    
    <div class="tree-wrapper">
        <div class="table-header">
            <div class="header-pad">Категория</div>
            <div class="col-fixed">Строк</div>
            <div class="col-fixed" style="color:var(--c-phones-text)">Тел</div>
            <div class="col-fixed" style="color:var(--c-emails-text)">Email</div>
        </div>
        <div id="treeContainer"></div>
    </div>
</div>

<div class="loader" id="loader">
    <div class="spinner"></div>
    <h3 style="margin-top:20px; color:#475569;">Загрузка данных...</h3>
    <div id="errorText" class="error-box"></div>
</div>

<script>
    // === МАТРИЦА ЦЕН (ДЕЛЕНИЕ НА 2) ===
    const TIERS = [
        { limit: 1000,   rate: 0.10,  name: "Новичок" },
        { limit: 5000,   rate: 0.075, name: "Старт" },
        { limit: 10000,  rate: 0.06,  name: "Активный" },
        { limit: 50000,  rate: 0.04,  name: "Бизнес" },
        { limit: 100000, rate: 0.03,  name: "Профи" },
        { limit: 300000, rate: 0.02,  name: "Корпоративный" },
        { limit: Infinity, rate: 0.005, name: "Опт" }
    ];
    
    const PRICE_STEP = 500;
    const DATA_FILE = 'Moscow.txt';

    let treeData = [];
    let selectedIds = new Set();
    let debounceTimer;

    window.onload = async () => {
        document.getElementById('searchInput').addEventListener('input', debounceSearch);
        try {
            const resp = await fetch(DATA_FILE);
            if (!resp.ok) throw new Error('File error');
            const text = await resp.text();
            let rawNodes = parseHierarchy(text);
            if (rawNodes.length === 1) {
                treeData = rawNodes;
                treeData[0].name = "ВСЕ БАЗЫ"; treeData[0].isRoot = true; treeData[0].expanded = true;
            } else if (rawNodes.length > 1) {
                const totalStats = rawNodes.reduce((acc, node) => {
                    acc.l += node.stats.l; acc.p += node.stats.p; acc.e += node.stats.e;
                    return acc;
                }, { l:0, p:0, e:0 });
                const rootNode = { id: 'ROOT_WRAPPER', name: 'ВСЕ БАЗЫ', stats: totalStats, children: rawNodes, expanded: true, visible: true, isRoot: true };
                treeData = [rootNode];
            } else { treeData = []; }
            renderTree(treeData, document.getElementById('treeContainer'), 0);
            document.getElementById('loader').style.display = 'none';
        } catch (e) {
            document.querySelector('.spinner').style.display = 'none';
            document.getElementById('errorText').style.display = 'block';
            document.getElementById('errorText').innerHTML = `Ошибка: файл <b>${DATA_FILE}</b> не найден.`;
        }
    };

    function parseHierarchy(text) {
        const lines = text.split('\n');
        const root = [];
        const stack = [{ level: -1, children: root }];
        let idCounter = 0;
        const regex = /\[(?:Строк:\s*(\d+)\s*\|\s*Тел:\s*(\d+)\s*\|\s*Email:\s*(\d+)|0)\]\s*$/;
        lines.forEach(line => {
            const cleanLine = line.trim();
            if (!cleanLine || cleanLine.startsWith('=') || cleanLine.startsWith('Всего')) return;
            const level = line.search(/\S/);
            if (level === -1) return;
            const match = cleanLine.match(regex);
            let name = cleanLine;
            let stats = { l:0, p:0, e:0 };
            if (match) {
                name = cleanLine.substring(0, match.index).trim();
                if (match[1]) {
                    stats.l = parseInt(match[1])||0; stats.p = parseInt(match[2])||0; stats.e = parseInt(match[3])||0;
                }
            }
            const node = { id: idCounter++, name, stats, children: [], expanded: false, visible: true };
            while (stack.length > 1 && stack[stack.length-1].level >= level) stack.pop();
            stack[stack.length-1].children.push(node);
            stack.push({ level, children: node.children });
        });
        return root;
    }

    function renderTree(nodes, container, depth) {
        const ul = document.createElement('ul');
        ul.className = (container.id === 'treeContainer') ? 'root' : 'nested';
        nodes.forEach(node => {
            if (!node.visible) return;
            const li = document.createElement('li');
            const hasChildren = node.children.length > 0;
            const isSelected = selectedIds.has(node.id);
            const row = document.createElement('div');
            row.className = `node-row ${isSelected ? 'selected' : ''} ${node.isRoot ? 'is-root-node' : ''}`;
            
            const leftDiv = document.createElement('div');
            leftDiv.className = 'row-left';
            leftDiv.style.paddingLeft = (depth * 20) + 'px'; 
            const toggler = document.createElement('div');
            toggler.className = `toggler ${hasChildren ? '' : 'empty'}`;
            toggler.innerHTML = node.expanded ? '▼' : '▶';
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.checked = isSelected;
            const nameDiv = document.createElement('div');
            nameDiv.className = 'node-name';
            nameDiv.innerText = node.name;
            leftDiv.append(toggler, checkbox, nameDiv);

            const rightDiv = document.createElement('div');
            rightDiv.className = 'row-right';
            const createBadge = (type, val) => {
                const cell = document.createElement('div');
                cell.className = 'col-fixed';
                cell.innerHTML = val > 0 ? `<div class="badge b-${type}">${val.toLocaleString()}</div>` : `<span style="opacity:0.3; font-size:0.8rem">—</span>`;
                return cell;
            }
            rightDiv.append(createBadge('lines', node.stats.l), createBadge('phones', node.stats.p), createBadge('emails', node.stats.e));
            row.append(leftDiv, rightDiv);
            li.appendChild(row);

            const toggleExpand = (e) => {
                e.stopPropagation();
                if (!hasChildren) return;
                node.expanded = !node.expanded;
                toggler.innerHTML = node.expanded ? '▼' : '▶';
                let childUl = li.querySelector('ul.nested');
                if (!childUl) { renderTree(node.children, li, depth + 1); childUl = li.querySelector('ul.nested'); }
                if (node.expanded) childUl.style.display = 'block'; else childUl.style.display = 'none';
            };
            const toggleCheck = (e) => {
                e.stopPropagation();
                const checked = e.target.checked;
                const setRecursive = (n, s) => {
                    s ? selectedIds.add(n.id) : selectedIds.delete(n.id);
                    if (n.children) n.children.forEach(c => setRecursive(c, s));
                };
                setRecursive(node, checked);
                document.getElementById('treeContainer').innerHTML = '';
                renderTree(treeData, document.getElementById('treeContainer'), 0);
                recalculate();
            };
            toggler.onclick = toggleExpand;
            row.onclick = (e) => { if(e.target !== checkbox && !e.target.closest('.toggler')) toggleCheck(e); }; 
            checkbox.onclick = toggleCheck; 
            if (node.expanded && hasChildren) {
                renderTree(node.children, li, depth + 1);
                li.querySelector('ul.nested').style.display = 'block';
            }
            ul.appendChild(li);
        });
        container.appendChild(ul);
    }

    // === ЛОГИКА РАСЧЕТА + ШКАЛЫ ===
    function recalculate() {
        let l=0, p=0, e=0;
        function traverse(nodes) {
            nodes.forEach(n => {
                if (selectedIds.has(n.id)) {
                    l += n.stats.l; p += n.stats.p; e += n.stats.e;
                } else { if (n.children.length) traverse(n.children); }
            });
        }
        traverse(treeData);
        const volume = l + p + e;

        // 1. Находим текущий уровень и следующий
        let currentTier = TIERS[0];
        let nextTier = TIERS[1];
        let tierIndex = 0;

        for (let i = 0; i < TIERS.length; i++) {
            if (volume < TIERS[i].limit) {
                currentTier = TIERS[i];
                tierIndex = i;
                nextTier = TIERS[i+1] || null; // Может быть null если это последний уровень
                break;
            }
        }
        // Если volume больше последнего лимита
        if (volume >= TIERS[TIERS.length-1].limit) {
             currentTier = TIERS[TIERS.length-1];
             tierIndex = TIERS.length - 1;
             nextTier = null;
        }

        // 2. Расчет цены
        const rawPrice = volume * currentTier.rate;
        let finalPrice = Math.ceil(rawPrice / PRICE_STEP) * PRICE_STEP;
        if (finalPrice === 0 && volume > 0) finalPrice = PRICE_STEP;

        // 3. Обновляем UI
        document.getElementById('selLines').innerText = l.toLocaleString();
        document.getElementById('selPhones').innerText = p.toLocaleString();
        document.getElementById('selEmails').innerText = e.toLocaleString();
        document.getElementById('totalPrice').innerText = finalPrice.toLocaleString();
        document.getElementById('currentTierBadge').innerText = `${currentTier.name} (${currentTier.rate}₽/шт)`;

        // 4. Логика Шкалы "Следующий уровень" (Blue)
        const levelBox = document.getElementById('levelBox');
        if (nextTier) {
            levelBox.classList.add('active');
            const diff = nextTier.limit - volume;
            document.getElementById('nextTierRate').innerText = `до ${nextTier.rate}₽`;
            document.getElementById('toNextLevel').innerText = diff.toLocaleString();
            
            // Прогресс: от limit предыдущего уровня до limit текущего
            // Чтобы шкала была красивой, считаем прогресс внутри текущего отрезка
            const prevLimit = (tierIndex > 0) ? TIERS[tierIndex-1].limit : 0;
            const range = nextTier.limit - prevLimit;
            const currentVal = volume - prevLimit;
            let percent = (currentVal / range) * 100;
            if(percent < 5) percent = 5; // Минимум, чтобы было видно
            document.getElementById('levelProgress').style.width = percent + '%';
        } else {
            // Максимальный уровень
            levelBox.classList.remove('active');
        }

        // 5. Логика Шкалы "Бонус" (Green)
        const bonusBox = document.getElementById('bonusBox');
        const maxVolumeForThisPrice = Math.floor(finalPrice / currentTier.rate);
        const freeVolume = maxVolumeForThisPrice - volume;
        
        if (freeVolume > 0 && volume > 0) {
            bonusBox.classList.add('active');
            document.getElementById('paidFor').innerText = finalPrice;
            document.getElementById('freeCount').innerText = freeVolume.toLocaleString();
            // Прогресс заполнения "ведёрка" в 500р
            // Объем "пакета 500р" в штуках = PRICE_STEP / currentTier.rate
            const bucketSize = PRICE_STEP / currentTier.rate;
            // Остаток от деления объема на размер ведра = сколько занято в текущем ведре
            const filledInBucket = volume % bucketSize;
            // Если filledInBucket == 0 и volume > 0, значит ведро полно (100%), но мы уже округлили цену вверх
            // Визуально сделаем % заполнения
            let percentFilled = (filledInBucket / bucketSize) * 100;
            if (percentFilled === 0 && volume > 0) percentFilled = 100;
            
            document.getElementById('bonusProgress').style.width = percentFilled + '%';
        } else {
            bonusBox.classList.remove('active');
        }
    }

    function resetAll() {
        selectedIds.clear();
        document.getElementById('treeContainer').innerHTML = '';
        renderTree(treeData, document.getElementById('treeContainer'), 0);
        recalculate();
    }
    function debounceSearch() { clearTimeout(debounceTimer); debounceTimer = setTimeout(runSearch, 300); }
    function runSearch() {
        const q = document.getElementById('searchInput').value.toLowerCase();
        const filter = (node) => {
            const match = node.name.toLowerCase().includes(q);
            let childMatch = false;
            if (node.children.length) node.children.forEach(c => { if (filter(c)) childMatch = true; });
            node.visible = match || childMatch;
            if (q && childMatch) node.expanded = true;
            else if (!q) node.expanded = !!node.isRoot; 
            return node.visible;
        };
        treeData.forEach(filter);
        document.getElementById('treeContainer').innerHTML = '';
        renderTree(treeData, document.getElementById('treeContainer'), 0);
    }
    function downloadOrder() {
        if (selectedIds.size === 0) { alert('Ничего не выбрано!'); return; }
        const price = document.getElementById('totalPrice').innerText;
        const tier = document.getElementById('currentTierBadge').innerText;
        let text = `ЗАКАЗ\nДата: ${new Date().toLocaleString()}\n`;
        text += `К оплате: ${price} руб.\n`;
        text += `Тариф: ${tier}\n`;
        text += `Объем: L:${document.getElementById('selLines').innerText} P:${document.getElementById('selPhones').innerText} E:${document.getElementById('selEmails').innerText}\n`;
        text += `--------------------------------\n`;
        const traverseWrite = (nodes) => {
            nodes.forEach(n => {
                if (selectedIds.has(n.id)) text += `[+] ${n.name} (L:${n.stats.l} P:${n.stats.p} E:${n.stats.e})\n`;
                else if (n.children.length) traverseWrite(n.children);
            });
        };
        traverseWrite(treeData);
        const link = document.createElement('a');
        link.href = URL.createObjectURL(new Blob([text], {type: 'text/plain'}));
        link.download = `Order_${price}RUB.txt`;
        link.click();
    }
</script>

</body>
</html>
